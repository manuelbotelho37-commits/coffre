<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Coffre</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181d">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14181d; --surface:#1c222a; --surface2:#242b34; --line:#323a45;
    --text:#e9e7e1; --dim:#8b94a1; --brass:#c89b3c; --green:#5f9e79; --red:#c4635a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,.serif{font-family:'Fraunces',serif; font-weight:600;}
  .wrap{max-width:640px; margin:0 auto; padding:0 18px 120px;}
  .center{max-width:420px; margin:0 auto; padding:70px 22px 40px; text-align:center;}
  .center h1{font-size:2.2rem; margin:12px 0 6px;}
  .center p{color:var(--dim); font-size:.95rem; line-height:1.5; margin:0 0 22px;}
  .big{font-size:3rem;}
  input,textarea{width:100%; padding:14px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:1rem; font-family:inherit;}
  input:focus,textarea:focus{outline:none; border-color:var(--brass);}
  textarea{min-height:90px; resize:vertical;}
  label{display:block; text-align:left; font-size:.8rem; color:var(--dim); margin:14px 0 6px;}
  button{font-family:inherit; font-size:1rem; cursor:pointer; border-radius:10px; padding:14px 16px; border:1px solid var(--line); background:var(--surface2); color:var(--text);}
  .primary{background:var(--brass); color:#1a1508; border-color:var(--brass); font-weight:600; width:100%; margin-top:18px;}
  .danger{color:var(--red); border-color:#5a2f2b;}
  .err{color:var(--red); font-size:.88rem; min-height:1.2em; margin-top:12px;}
  .warn{background:#2a2414; border:1px solid #5a4a1c; color:#e8d49a; padding:12px 14px; border-radius:10px; font-size:.85rem; line-height:1.45; text-align:left; margin:0 0 6px;}

  header{display:flex; align-items:center; justify-content:space-between; padding:22px 0 12px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;}
  header h1{margin:0; font-size:1.7rem;}
  .hbtn{display:flex; gap:8px;}
  .hbtn button{padding:10px 14px; font-size:.9rem;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 6px;}
  .chip{white-space:nowrap; padding:10px 16px; border-radius:22px; background:transparent; font-size:.92rem; color:var(--dim);}
  .chip.on{background:var(--brass); color:#1a1508; border-color:var(--brass); font-weight:600;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-top:10px; overflow:hidden;}
  .card.open{border-color:var(--brass);}
  .head{display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer;}
  .ico{font-size:1.5rem; width:34px; text-align:center;}
  .ttl{flex:1; min-width:0;}
  .ttl b{display:block; font-size:1.02rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ttl span{display:block; color:var(--dim); font-size:.84rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chev{color:var(--dim);}
  .body{padding:0 14px 14px; border-top:1px solid var(--line);}
  .fld{padding:12px 0 4px;}
  .fld+.fld{border-top:1px solid var(--line); margin-top:10px; padding-top:14px;}
  .fld .val{align-items:flex-start;}
  .fld small{display:block; color:var(--dim); font-size:.76rem; margin-bottom:5px;}
  .fld .val{display:flex; align-items:center; gap:8px;}
  .fld .txt{flex:1; word-break:break-all; font-size:1.02rem; font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap;}
  .fld .txt.plain{font-family:inherit;}
  .fld button{padding:9px 12px; font-size:.84rem;}
  .acts{display:flex; gap:8px; margin-top:16px;}
  .acts button{flex:1; padding:12px;}
  .empty{text-align:center; color:var(--dim); padding:50px 12px; font-size:.95rem; line-height:1.5;}
  .fab{position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--brass); color:#1a1508; border:none; font-weight:700; padding:16px 22px; border-radius:30px; box-shadow:0 6px 20px rgba(0,0,0,.45); z-index:6;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:20; padding:12px;}
  .sheet{background:var(--surface); width:100%; max-width:640px; max-height:90%; overflow:auto; border-radius:20px; padding:20px 18px 18px;}
  .foot{position:sticky; bottom:-18px; background:var(--surface); padding:12px 0 18px; margin-top:6px;}
  .sheet h2{margin:0 0 4px; font-size:1.3rem;}
  .row2{display:flex; gap:8px;}
  .row2 button{flex:1;}
  .gen{margin-top:8px; padding:10px 14px; font-size:.85rem; width:auto;}
  .toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#0c0f13; border:1px solid var(--line); padding:12px 18px; border-radius:24px; font-size:.9rem; z-index:30; max-width:90%; text-align:center;}
  .xblk{margin-top:14px; position:relative;}
  .xtra,.xpad{padding-right:96px;}
  .xdel{position:absolute; top:8px; right:8px; padding:7px 12px; font-size:.82rem; color:var(--red); border-color:#5a2f2b; background:var(--surface);}
  .lockbtn{display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border-radius:6px; border:1.5px solid; line-height:1; flex:none;}
  .lockbtn.closed{color:#ff5f56; border-color:#ff5f56; background:rgba(255,95,86,.12);}
  .lockbtn.open{color:#3ddc84; border-color:#3ddc84; background:rgba(61,220,132,.12);}
  .lockbtn svg{width:16px; height:16px; fill:currentColor; stroke:currentColor; stroke-width:2; stroke-linecap:round;}
  .lockbtn svg .sh{fill:none;}
  .dhead{display:flex; align-items:center; gap:12px; padding:20px 0 14px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; border-bottom:1px solid var(--line);}
  .back{padding:6px 14px; font-size:1.4rem; line-height:1;}
  .dtitle{flex:1; min-width:0; font-family:'Fraunces',serif; font-weight:600; font-size:1.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #detailwrap .body{padding:0 0 40px; border-top:none;}
  .blk{border:1px solid var(--line); border-radius:10px; background:var(--surface2); overflow:hidden;}
  .blk textarea.hid{display:none;}
  .xblk.fonly .xdel{display:none;}
  .blk.fonly .fl{padding-top:0;}
  .fld.ro{border:1px solid var(--line); border-radius:10px; background:var(--surface2); padding:6px 12px; margin-top:12px;}
  .fld.ro .frow:first-child{border-top:none;}
  .fld.ro+.fld.ro{border-top:1px solid var(--line); padding-top:6px; margin-top:12px;}
  .blk:focus-within{border-color:var(--brass);}
  .blk textarea.etext{min-height:48px; border:none; background:transparent; border-radius:0; resize:vertical; margin:0;}
  .blk textarea.etext:focus{border:none;}
  .fbtns{display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px; border-top:1px solid var(--line);}
  .fbtns .gen{margin:0; padding:6px 10px; font-size:.76rem; border-radius:8px; white-space:nowrap;}
  .fl{margin:0; padding:0 10px;}
  .fl:empty{display:none;}
  .frow{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
  .fbad{width:64px; height:64px; border-radius:8px; border:1px dashed var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.2rem; color:var(--red); flex:none;}
  .fbad small{font-size:.62rem; margin-top:2px;}
  .fthumb{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--surface2); cursor:pointer;}
  .ficon{font-size:1.8rem; width:64px; text-align:center;}
  .fname{flex:1; min-width:0; word-break:break-all; font-size:.92rem; cursor:pointer;}
  .fname small{display:block; color:var(--dim); font-size:.75rem; margin-top:2px;}
  .ren2{padding:7px 12px; font-size:.82rem;}
  .xdel2{padding:7px 12px; font-size:.82rem; color:var(--red); border-color:#5a2f2b;}
  .lnks{margin-top:8px;}
  .blk .lnks{margin:0; padding:0 10px;}
  .blk .lnks:empty{display:none;}
  .lnk{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line);}
  .lnk .lu{flex:1 1 100%; color:var(--brass); font-size:.8rem; word-break:break-all;}
  .lnk button{padding:8px 14px; font-size:.84rem;}
  .frow.ro{cursor:default;}
  .frow.ro .fthumb{cursor:default; pointer-events:none;}
  .fopen{color:var(--dim); font-size:.85rem; padding-right:4px;}
  .flro{margin-top:4px;}
  .fgrid{display:flex; flex-direction:column; gap:10px; margin-top:12px; align-items:flex-start;}
  .fimg{max-width:100%; max-height:62vh; width:auto; height:auto; object-fit:contain; border-radius:10px; border:1px solid var(--line); background:var(--surface2); cursor:pointer;}
  .fchip{padding:10px 14px; font-size:.92rem; text-align:left;}
  .fchip small{color:var(--dim); margin-left:6px;}
  .lockrow{display:flex; justify-content:flex-end; padding-top:12px;}
  .lockedhint{margin-top:16px; color:var(--dim); font-size:.84rem; text-align:center;}
  #f_text{margin-top:14px;}
  .keep{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0 4px; cursor:pointer;}
  .keep b{display:block; font-size:.95rem;}
  .keep span{display:block; color:var(--dim); font-size:.78rem; margin-top:3px; line-height:1.35;}
  .sw{flex:none; width:58px; height:32px; border-radius:16px; background:#3a424d; position:relative; transition:background .2s;}
  .sw i{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .2s;}
  .sw.on{background:var(--green);}
  .sw.on i{left:29px;}
  .setbtn{width:100%; text-align:left; margin-top:10px;}
  .setbtn small{display:block; color:var(--dim); font-size:.78rem; margin-top:3px;}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="big">🔐</div><p>Chargement…</p></div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
const CATS = {
  pass:  {label:'Mots de passe', icon:'🔑', fields:[['name','Site ou application',0],['user','Identifiant / e-mail',0],['pwd','Mot de passe',1],['note','Note',0,1]]},
  bank:  {label:'Banque',        icon:'🏦', fields:[['name','Banque / compte',0],['holder','Titulaire',0],['iban','IBAN',1],['num','N° de compte',1],['code','Code ou identifiant',1],['note','Note',0,1]]},
  wifi:  {label:'Wi-Fi',         icon:'📶', fields:[['name','Lieu / nom du réseau',0],['pwd','Clé Wi-Fi',1],['note','Note',0,1]]},
  other: {label:'Autres',        icon:'📝', fields:[['name','Titre',0],['text','Contenu',1,1]]}
};
const LS = 'coffre_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

let db=null, uid=null, key=null, salt=null, record=null;
let items=[], filter='all', q='', openId=null, revealed=new Set();
let lockTimer=null, hiddenAt=0, pendingRestore=null;
let iters=1000000, fails=0, keepExp=0, keepT=null;
function kvOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('coffre_keep',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ const d=await kvOpen(); return new Promise((res,rej)=>{ const q=d.transaction('k').objectStore('k').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function kvSet(k,v){ const d=await kvOpen(); return new Promise((res,rej)=>{ const t=d.transaction('k','readwrite'); t.objectStore('k').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function kvDel(k){ try{ const d=await kvOpen(); await new Promise((res)=>{ const t=d.transaction('k','readwrite'); t.objectStore('k').delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){} }
function fmtExp(t){ return new Date(t).toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'}); }
async function setKeep(on){
  clearTimeout(keepT);
  if(on){
    const exp = keepExp || (Date.now()+24*3600*1000);
    await kvSet('keep', {key, exp});
    keepExp = exp;
    clearTimeout(lockTimer);
    keepT = setTimeout(lock, Math.max(1000, exp-Date.now()));
  } else {
    await kvDel('keep'); keepExp = 0; resetTimer();
  }
  renderKeep();
}
async function toggleKeep(){
  try{
    if(keepExp){ await setKeep(false); toast('Le code sera redemandé'); }
    else { await setKeep(true); toast('Déverrouillé pendant 24 h'); }
  }catch(e){ keepExp=0; renderKeep(); toast('Impossible sur cet appareil'); }
}
function renderKeep(){
  const el=$('#keepRow'); if(!el) return;
  el.innerHTML = `<div><b>Rester déverrouillé 24 h</b><span>${keepExp ? 'Actif jusqu\'à '+esc(fmtExp(keepExp))+'. Le code n\'est pas demandé. Quiconque a ton appareil peut ouvrir le coffre.' : 'Désactivé : le code est demandé après 2 minutes d\'inactivité.'}</span></div><div class="sw ${keepExp?'on':''}"><i></i></div>`;
}
const normCode = v => String(v||'').replace(/[\s-]/g,'');
let strongFlag=false, lkT=null;
let dkey=null, fkB64='', lastFk=null;
function codeProblem(v){
  v=normCode(v);
  if(/^\d+$/.test(v)){ if(v.length<12) return 'Avec des chiffres seulement, il en faut au moins 12.'; }
  else {
    const types=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(v)).length;
    if(v.length<10 || (types<2 && v.length<16)) return 'Il faut au moins 10 caractères, avec des lettres ET des chiffres.';
  }
  if(new Set(v).size<5) return 'Ce code est trop simple : utilise des caractères variés.';
  return '';
}
function codeHint(v){
  const el=$('#hint'); if(!el) return;
  if(!v){ el.textContent=''; return; }
  const p=codeProblem(v);
  el.style.color = p ? 'var(--red)' : 'var(--green)';
  el.textContent = p || '✓ Code solide';
}
function genCode(){
  const a=crypto.getRandomValues(new Uint32Array(12)); let d='';
  for(let i=0;i<12;i++) d+=String(a[i]%10);
  const g=d.slice(0,4)+' '+d.slice(4,8)+' '+d.slice(8,12);
  ['p1','p2','n1','n2'].forEach(id=>{ const e=$('#'+id); if(e){ e.type='text'; e.value=g; } });
  codeHint(g);
  const m=$('#genmsg'); if(m) m.textContent='Note ce code sur papier MAINTENANT, avant de continuer.';
}
function lkGet(){ try{ return JSON.parse(localStorage.getItem('coffre_lk')||'{}'); }catch(e){ return {}; } }
function lkSet(o){ try{ localStorage.setItem('coffre_lk', JSON.stringify(o)); }catch(e){} }
function fmtWait(n){ return n>=60 ? Math.ceil(n/60)+' min' : n+' s'; }
function applyLockout(){
  const b=$('#go'); if(!b) return;
  const left=Math.ceil(((lkGet().until||0)-Date.now())/1000);
  if(left>0){ b.disabled=true; b.dataset.locked='1'; b.textContent='Patiente '+fmtWait(left); clearTimeout(lkT); lkT=setTimeout(applyLockout,1000); }
  else if(b.dataset.locked){ b.disabled=false; b.textContent='Ouvrir'; setErr(''); delete b.dataset.locked; }
}

/* ---------- Chiffrement (dans ton navigateur uniquement) ---------- */
async function deriveKey(pw, s, it){
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:s, iterations:(it||310000), hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptRecord(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify({items, fk:fkB64})));
  return {v:1, s:(strongFlag?1:0), ts:Date.now(), it:iters, salt:b64(salt), iv:b64(iv), data:b64(ct)};
}
async function decryptRecord(rec, k){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, k, unb64(rec.data));
  const p = JSON.parse(dec.decode(pt));
  if(Array.isArray(p)){ lastFk=null; return p; }
  lastFk = p.fk || null; return p.items || [];
}
async function initDataKey(){
  let migrate=false;
  if(lastFk){ fkB64=lastFk; } else { fkB64=b64(crypto.getRandomValues(new Uint8Array(32))); migrate=true; }
  dkey = await crypto.subtle.importKey('raw', unb64(fkB64), 'AES-GCM', false, ['encrypt','decrypt']);
  if(migrate){
    for(const it of items){
      for(const id of filesOfItem(it)){
        try{
          const r=await fGet(id); if(!r||r.k) continue;
          const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv}, key, r.ct);
          const e=await encBuf(buf); await fPut(id,{iv:e.iv,ct:e.ct,k:1});
        }catch(e){}
      }
    }
    try{ await save(true); }catch(e){}
  }
}

/* ---------- Stockage ---------- */
async function initStore(){
  try{ db = await claude.use('db'); }catch(e){ db=null; }
  try{ const u = await claude.use('user'); if(u) uid = await u.id(); }catch(e){ uid=null; }
}
function docRef(){ return (db && uid) ? db.doc('data/users/'+uid+'/vault') : null; }
async function loadRecord(){
  let cloud=null, loc=null;
  const r=docRef();
  if(r){ try{ const sn = await r.get(); if(sn.exists) cloud=sn.data(); }catch(e){} }
  try{ const l=localStorage.getItem(LS); if(l) loc=JSON.parse(l); }catch(e){}
  if(cloud && loc) return ((loc.ts||0) > (cloud.ts||0)) ? loc : cloud;
  return cloud || loc;
}
async function persist(rec){
  let cloud=false, local=false;
  const r = docRef();
  if(r){ try{ await r.set(rec); cloud=true; }catch(e){} }
  try{ localStorage.setItem(LS, JSON.stringify(rec)); local=true; }catch(e){}
  return {cloud, local};
}
async function save(silent){
  const rec = await encryptRecord();
  record = rec;
  const res = await persist(rec);
  if(res.cloud){ if(!silent) toast('✓ Enregistré'); }
  else if(res.local) toast(typeof claude==='undefined' ? '✓ Enregistré' : 'Enregistré sur cet appareil seulement');
  else toast('⚠️ Impossible d\'enregistrer');
}

/* ---------- Petits outils ---------- */
let toastT;
function toast(t){
  const el=$('#toast'); el.innerHTML='<div class="toast">'+esc(t)+'</div>';
  clearTimeout(toastT); toastT=setTimeout(()=>{el.innerHTML='';}, 2600);
}
function openModal(html){ $('#modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">'+html+'</div></div>'; }
function closeModal(){ $('#modal').innerHTML=''; }
function setErr(t){ const e=$('#err'); if(e) e.textContent=t||''; }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function genPassword(){
  const set='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*?';
  const a=crypto.getRandomValues(new Uint32Array(16)); let s='';
  for(let i=0;i<16;i++) s+=set[a[i]%set.length];
  return s;
}
async function copyText(t, keep){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(x){} ta.remove();
  }
  toast(keep ? '✓ Lien copié' : 'Copié (effacé du presse-papiers dans 30 s)');
  if(!keep) setTimeout(()=>{ try{navigator.clipboard.writeText(' ');}catch(e){} }, 30000);
}
function extractLinks(t){
  const m=(t||'').match(/https?:\/\/[^\s<>"']+/g)||[]; const out=[];
  m.forEach(u=>{ u=u.replace(/[.,;:!?)\]]+$/,''); if(u && out.indexOf(u)<0) out.push(u); });
  return out;
}
function linksHtml(t){
  const L=extractLinks(t); if(!L.length) return '';
  return '<div class="lnks">'+L.map(u=>`<div class="lnk"><span class="lu">${esc(u)}</span><button type="button" data-u="${esc(u)}" onclick="copyText(this.dataset.u,true)">📋 Copier</button><button type="button" data-u="${esc(u)}" onclick="openLink(this.dataset.u)">↗ Ouvrir</button></div>`).join('')+'</div>';
}
function openLink(u){ const w=window.open(u,'_blank','noopener'); if(!w){ location.href=u; } }

/* ---------- Verrouillage automatique ---------- */
function resetTimer(){
  clearTimeout(lockTimer);
  if(key && !keepExp) lockTimer=setTimeout(lock, 120000);
}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, resetTimer, {passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(key && !keepExp && hiddenAt && Date.now()-hiddenAt>60000){ lock(); }
});
async function lock(){
  if(key){ try{ clearTimeout(edT); collectOpenInline(); items.forEach(i=>{i.locked=true;}); await save(true); }catch(e){} }
  kvDel('keep'); keepExp=0; clearTimeout(keepT);
  urlCache.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); urlCache.clear();
  dkey=null; fkB64=''; lastFk=null;
  key=null; items=[]; openId=null; revealed=new Set(); q=''; filter='all';
  clearTimeout(lockTimer); closeModal();
  renderLock();
}

async function doSetup(){
  const p1=normCode($('#p1').value), p2=normCode($('#p2').value);
  const pr=codeProblem(p1); if(pr) return setErr(pr);
  if(p1!==p2) return setErr('Les deux codes ne sont pas identiques.');
  const b=$('#go'); b.disabled=true; b.textContent='Création…';
  salt=crypto.getRandomValues(new Uint8Array(16)); iters=1000000; strongFlag=true;
  key=await deriveKey(p1, salt, iters); items=[]; lastFk=null; await initDataKey();
  await save(); resetTimer(); renderMain();
}
async function doUnlock(){
  const p=normCode($('#pw').value); if(!p) return;
  const lkc=lkGet(); if((lkc.until||0)>Date.now()){ applyLockout(); return; }
  const b=$('#go'); b.disabled=true; b.textContent='Ouverture…';
  try{
    const s=unb64(record.salt); const it=record.it||310000;
    const k=await deriveKey(p, s, it);
    items=await decryptRecord(record, k); items.forEach(i=>{i.locked=true;}); key=k; salt=s; iters=it; fails=0;
    strongFlag=!!record.s; lkSet({});
    try{ await initDataKey(); }catch(e){}
    resetTimer(); renderMain();
  }catch(e){
    const n=(lkGet().n||0)+1; let until=0;
    if(n>=3) until=Date.now()+Math.min(15*Math.pow(2,n-3),900)*1000;
    lkSet({n, until});
    b.disabled=false; b.textContent='Ouvrir'; setErr('Code incorrect.');
    const pw=$('#pw'); if(pw) pw.value='';
    if(until) applyLockout();
  }
}

/* --- fichiers et photos (chiffrés, gardés sur cet appareil) --- */
const DL_OK=['gif','png','jpg','jpeg','webp','mp4','webm','txt','json','md','docx','pptx','epub','csv','html','svg','pdf','xlsx','zip'];
const DL_MIME={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','text/plain':'txt','text/csv':'csv','application/zip':'zip','application/json':'json','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx'};
function fOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('coffre_files',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function fPut(id,v){ const d=await fOpen(); return new Promise((res,rej)=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').put(v,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function fGet(id){ const d=await fOpen(); return new Promise((res,rej)=>{ const q=d.transaction('f').objectStore('f').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function fDel(id){ try{ const d=await fOpen(); await new Promise(res=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').delete(id); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){} for(const [k,u] of Array.from(urlCache)){ if(k.indexOf(id+'_')===0){ try{URL.revokeObjectURL(u);}catch(e){} urlCache.delete(k); } } }
const urlCache=new Map();
async function encBuf(buf){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},dkey,buf); return {iv,ct}; }
async function decBuf(rec){ return crypto.subtle.decrypt({name:'AES-GCM',iv:rec.iv}, rec.k?dkey:key, rec.ct); }
function isImg(m){ return /^image\//.test(m.type||'') || /\.(jpe?g|png|webp|gif|heic)$/i.test(m.name||''); }
function fmtSize(n){ n=n||0; return n>=1048576 ? (n/1048576).toFixed(1).replace('.',',')+' Mo' : Math.max(1,Math.round(n/1024))+' Ko'; }
async function rotateBlob(blob,deg){
  const u=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; });
  const sw=img.naturalWidth, sh=img.naturalHeight, swap=(deg%180)!==0;
  const c=document.createElement('canvas'); c.width=swap?sh:sw; c.height=swap?sw:sh;
  const g=c.getContext('2d'); g.translate(c.width/2,c.height/2); g.rotate(deg*Math.PI/180); g.drawImage(img,-sw/2,-sh/2);
  URL.revokeObjectURL(u);
  return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',0.92));
}
async function fileUrl(m){
  const rot=(((m.rot||0)%360)+360)%360, ck=m.id+'_'+rot;
  if(urlCache.has(ck)) return urlCache.get(ck);
  const rec=await fGet(m.id); if(!rec) return null;
  const buf=await decBuf(rec);
  let blob=new Blob([buf],{type:m.type||'image/jpeg'});
  if(rot) blob=await rotateBlob(blob,rot);
  const url=URL.createObjectURL(blob); urlCache.set(ck,url); return url;
}

    try{ const u=await fileUrl({id:im.dataset.fid,type:im.dataset.type,rot:parseInt(im.dataset.rot)||0}); if(u) im.src=u; else bad('Absente'); }
    catch(e){ bad('Illisible'); }

}
function getFiles(b){ try{ return JSON.parse(b.dataset.files||'[]'); }catch(e){ return []; } }
function setFiles(b,a){ b.dataset.files=JSON.stringify(a); }
function findMeta(id){

  return null;
}
function filesOfItem(it){ const out=[]; Object.keys(it.f).forEach(k=>{ if(k.indexOf('a_')===0 && Array.isArray(it.f[k])) it.f[k].forEach(m=>out.push(m.id)); }); return out; }

async function onPickFile(inp){
  const blk=inp.closest('.blk'); const files=Array.from(inp.files||[]); inp.value='';
  const body=blk.closest('.body');
  // pièces illisibles de cet onglet : la nouvelle photo les remplace
  const badIds=Array.from(blk.querySelectorAll('.frow')).filter(r=>r.querySelector('.fbad')).map(r=>r.dataset.fid);
  if(badIds.length && files.length){
    setFiles(blk,getFiles(blk).filter(m=>!badIds.includes(m.id))); badIds.forEach(id=>fDel(id));
    blk.querySelector('.fl').innerHTML=fileRowsEdit(getFiles(blk));
  }
  for(const file of files){
    if(file.size>15*1024*1024){ toast('Fichier trop lourd (15 Mo maximum)'); continue; }
    try{
      const buf=await file.arrayBuffer(); const e=await encBuf(buf); const id='f'+newId();
      await fPut(id,{iv:e.iv,ct:e.ct,k:1});
      let target=blk;
      if(getFiles(blk).length>0){
        const box=body.querySelector('.eextras');
        box.insertAdjacentHTML('beforeend', blockHtml('', '', [], true));
        target=box.lastElementChild; attachGrow(target.querySelector('textarea'));
      }
      const a=getFiles(target); a.push({id,name:file.name||'photo.jpg',type:file.type||'',size:file.size}); setFiles(target,a);
      target.querySelector('.fl').innerHTML=fileRowsEdit(a);
      refreshBlock(target);
    }catch(err){ toast('Impossible d\'ajouter ce fichier'); }
  }
  loadImages(); inlineChanged();
}

function doRenameFile(){

function doDelFile(btn){

function removeBlock(btn){

function nameForDl(m){
  let n=(m.name||'fichier').trim()||'fichier'; const e=(n.match(/\.([A-Za-z0-9]+)$/)||[])[1];
  if(e && DL_OK.includes(e.toLowerCase())) return n;
  const x=DL_MIME[m.type||'']; return x ? n.replace(/\.[A-Za-z0-9]+$/,'')+'.'+x : null;
}
async function saveBlobAs(name, blob){
  if(typeof claude!=='undefined' && claude && claude.use){
    const d=await claude.use('downloads'); if(!d) throw new Error('nodl');
    await d.save({filename:name, data:blob}); return;
  }
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function downloadFile(id){
  const m=findMeta(id); if(!m) return;
  try{
    const rec=await fGet(id); if(!rec){ toast('Fichier absent de cet appareil'); return; }
    const buf=await decBuf(rec); const name=nameForDl(m);
    if(!name){ toast('Ce format ne peut pas être téléchargé ici'); return; }
    await saveBlobAs(name, new Blob([buf],{type:m.type||'application/octet-stream'}));
  }catch(e){ if(!(e&&e.code==='declined')) toast('Échec du téléchargement'); }
}
async function rotateFile(id){
  const op=items.find(x=>x.id===openId); if(!op || itemLocked(op)) return;
  const m=findMeta(id); if(!m) return;
  m.rot=((m.rot||0)+90)%360;
  document.querySelectorAll('#detailwrap .blk').forEach(b=>{
    const a=getFiles(b); let ch=false; a.forEach(x=>{ if(x.id===id){ x.rot=m.rot; ch=true; } }); if(ch) setFiles(b,a);
  });
  try{
    const u=await fileUrl(m); const im=document.getElementById('viewimg'); if(im&&u) im.src=u;
    document.querySelectorAll('#detailwrap img[data-fid="'+id+'"]').forEach(async t=>{
      t.dataset.rot=m.rot; const uu=await fileUrl({id,type:m.type,rot:m.rot}); if(uu) t.src=uu;
    });
  }catch(e){}
  try{ await save(true); }catch(e){}
}
async function viewFile(id){
  { const lk=items.find(x=>x.id===openId); if(!lk || itemLocked(lk)) return; }
  collectOpenInline();

  }catch(e){ toast('Cette pièce est illisible. Supprime-la et ajoute-la de nouveau.'); }
}

let edT=null;
function upperInput(el){ const a=el.selectionStart,b=el.selectionEnd; el.value=el.value.toUpperCase(); try{el.setSelectionRange(a,b);}catch(e){} }
function collectInline(id){
  const it=items.find(x=>x.id===id), box=document.getElementById('ed_'+id);
  if(!it||!box) return;
  const f={}; const nm=box.querySelector('.ename');
  f.name=((nm&&nm.value.trim())?nm.value.trim():(it.f.name||'')).toUpperCase();
  let n=0;
  Array.from(box.querySelectorAll('.blk')).forEach((b,i)=>{
    const ta=b.querySelector('textarea.etext'); const v=cleanTxt(ta.value); const fl=getFiles(b);
    if(i===0){ f.text=v; f.h_text=ta.offsetHeight; if(fl.length) f.a_text=fl; }
    else if(v||fl.length){ f['m'+n]=v; f['h_m'+n]=ta.offsetHeight; if(fl.length) f['a_m'+n]=fl; n++; }
  });
  it.f=f;
  const dt=document.querySelector('.dtitle'); if(dt) dt.textContent=f.name;
}
function collectOpenInline(){
  if(!openId) return;
  const it=items.find(x=>x.id===openId);
  if(it && !itemLocked(it) && it.cat==='other') collectInline(openId);
}
function inlineChanged(){
  clearTimeout(edT);
  edT=setTimeout(async()=>{ collectOpenInline(); try{ await save(true); }catch(e){} }, 900);
}
function blockHtml(k,text,fl,extra){
  const hide = !(text||'').trim() && (fl||[]).length>0;
  return `<div class="blk${extra?' xblk':''}${hide?' fonly':''}" data-files="${esc(JSON.stringify(fl||[]))}">
    <textarea class="etext${extra?' xpad':''}${hide?' hid':''}"${k?` data-k="${k}"`:''} oninput="inlineChanged()">${esc(text||'')}</textarea>
    <div class="lnks elnks">${linksHtml(text)}</div>
    ${extra?'<button type="button" class="xdel" onclick="askDelExtra(this)">Supprimer</button>':''}
    <div class="fl">${fileRowsEdit(fl||[])}</div>
    <div class="fbtns"><button type="button" class="gen" onclick="this.parentNode.querySelector('.fgal').click()">🖼️ Galerie photo</button><button type="button" class="gen" onclick="this.parentNode.querySelector('.fcam').click()">📷 Prendre une photo</button><button type="button" class="gen" onclick="this.parentNode.querySelector('.fin').click()">📎 Fichier</button><button type="button" class="gen txtbtn" onclick="showText(this)">✏️ Texte</button><button type="button" class="gen" onclick="toggleBullets(this)">• Puces</button><input class="fgal" type="file" accept="image/*" multiple style="display:none" onchange="onPickFile(this)"><input class="fin" type="file" multiple style="display:none" onchange="onPickFile(this)"><input class="fcam" type="file" accept="image/*" capture="environment" style="display:none" onchange="onPickFile(this)"></div>
  </div>`;
}
function refreshLinks(blk){
  const ta=blk&&blk.querySelector('textarea.etext'); const box=blk&&blk.querySelector('.elnks');
  if(!ta||!box) return;
  const h=linksHtml(ta.value); if(box.innerHTML!==h) box.innerHTML=h;
}
document.addEventListener('input',function(e){
  const t=e.target; if(t && t.matches && t.matches('textarea.etext')) refreshLinks(t.closest('.blk'));
});
function refreshBlock(blk){
  const ta=blk.querySelector('textarea.etext'); if(!ta) return;
  const fl=getFiles(blk); const empty=!cleanTxt(ta.value);
  const hide = empty && fl.length>0 && !blk.dataset.showtxt;
  ta.classList.toggle('hid',hide); blk.classList.toggle('fonly',hide);
}
function showText(btn){
  const blk=btn.closest('.blk'); blk.dataset.showtxt='1'; refreshBlock(blk);
  const ta=blk.querySelector('textarea.etext');
  if(!ta.style.height || ta.offsetHeight<48) ta.style.height='90px';
  ta.focus(); try{ const n=ta.value.length; ta.setSelectionRange(n,n); }catch(e){}
}
function toggleBullets(btn){
  const blk=btn.closest('.blk'); const ta=blk.querySelector('textarea.etext');
  blk.dataset.showtxt='1'; refreshBlock(blk);
  if(!ta.value.trim()){ ta.value='• '; ta.focus(); try{ta.setSelectionRange(2,2);}catch(e){} }
  else{
    const lines=ta.value.split('\n');
    const filled=lines.filter(l=>l.trim()!=='');
    const all=filled.length>0 && filled.every(l=>/^\s*•/.test(l));
    ta.value=lines.map(l=>{
      if(l.trim()==='') return l;
      return all ? l.replace(/^\s*•\s?/,'') : (/^\s*•/.test(l) ? l : '• '+l);
    }).join('\n');
  }
  if(!ta.style.height || ta.offsetHeight<90) ta.style.height='90px';
  if(ta.scrollHeight>ta.clientHeight) ta.style.height=(ta.scrollHeight+4)+'px';
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function splitFiles(it){
  if(it.cat!=='other') return false;
  const ks=['text'].concat(extraKeys(it));
  const blocks=ks.map(k=>({t:it.f[k]||'', a:(it.f['a_'+k]||[]).slice(), h:it.f['h_'+k]}));
  if(!blocks.some(b=>b.a.length>1)) return false;
  const out=[];
  blocks.forEach(b=>{
    if(b.a.length<=1){ out.push(b); }
    else { out.push({t:b.t,a:[b.a[0]],h:b.h}); b.a.slice(1).forEach(x=>out.push({t:'',a:[x],h:0})); }
  });
  const f={name:it.f.name};
  out.forEach((b,i)=>{ const k=i===0?'text':'m'+(i-1); f[k]=b.t; if(b.h) f['h_'+k]=b.h; if(b.a.length) f['a_'+k]=b.a; });
  it.f=f; return true;
}
function addInlineExtra(id){
  const box=document.querySelector('#ed_'+id+' .eextras'); if(!box) return;
  box.insertAdjacentHTML('beforeend', blockHtml('',  '', [], true));
  const t=box.lastElementChild.querySelector('textarea'); t.style.height='90px'; attachGrow(t);
  t.scrollIntoView({block:'center'}); t.focus();
}
function initInline(){
  document.querySelectorAll('#detailwrap textarea.etext').forEach(ta=>{
    const blk0=ta.closest('.blk'); if(blk0) refreshBlock(blk0);
    if(ta.classList.contains('hid')) return;
    const body=ta.closest('.body'); const id=body?body.id.replace('ed_',''):''; const it=items.find(x=>x.id===id);
    const k=ta.dataset.k; let h=(it&&k)?(parseInt(it.f['h_'+k])||0):0;
    const blk=ta.closest('.blk'); const hasFiles=blk && getFiles(blk).length>0;
    const empty=!ta.value.trim();
    let minH=90;
    if(empty && hasFiles){ minH=48; h=0; }
    ta.style.height='auto'; ta.style.height=Math.max(h, ta.scrollHeight+4, minH)+'px';
    attachGrow(ta);
  });
}

function editHtml(it){

async function toggleLock(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  collectOpenInline();
  it.locked = !itemLocked(it);
  renderList();
  await save(true);
}
async function toggle(id){
  clearTimeout(edT);
  collectOpenInline();
  const prev=openId; let changed=false;
  const lockIt=pid=>{ const p=items.find(x=>x.id===pid); if(p && !itemLocked(p)){ p.locked=true; changed=true; } };
  if(prev===id){ lockIt(id); openId=null; }
  else { if(prev) lockIt(prev); openId=id; }
  revealed=new Set(); renderList();
  try{ window.scrollTo(0,0); }catch(e){}
  if(changed) await save(true);
}

function bulletize(ta){
  if(ta.dataset.bul) return; ta.dataset.bul='1';
  ta.addEventListener('focus',()=>{ if(!ta.value.trim()){ ta.value='• '; ta.setSelectionRange(2,2); } });
  ta.addEventListener('beforeinput',e=>{
    if(e.inputType!=='insertLineBreak' && e.inputType!=='insertParagraph') return;
    e.preventDefault();
    const st=ta.selectionStart, en=ta.selectionEnd, v=ta.value;
    const ls=v.lastIndexOf('\n',st-1)+1;
    const line=v.slice(ls,st);
    if(line.trim()==='•'){
      // ligne de puce vide : on termine la liste
      ta.setRangeText('', ls, en, 'end');
    } else {
      ta.setRangeText('\n• ', st, en, 'end');
    }
    ta.dispatchEvent(new Event('input',{bubbles:true}));
  });
}
function attachGrow(ta){
  bulletize(ta);
  ta.addEventListener('input',()=>{ if(ta.scrollHeight>ta.clientHeight) ta.style.height=(ta.scrollHeight+4)+'px'; });
}
function fitAreas(vals){
  const xs=Array.from(document.querySelectorAll('.xtra'));
  document.querySelectorAll('#modal textarea').forEach(ta=>{
    let k = ta.classList.contains('xtra') ? 'm'+xs.indexOf(ta) : (ta.id||'').replace('f_','');
    const h = parseInt((vals||{})['h_'+k])||0;
    ta.style.height='auto';
    ta.style.height=Math.max(h, ta.scrollHeight+4, 90)+'px';
    attachGrow(ta);
  });
}

async function doChangePw(){
  const cur=normCode($('#n0').value), a=normCode($('#n1').value), b=normCode($('#n2').value);
  if(!cur) return setErr('Entre ton code actuel.');
  try{ const k0=await deriveKey(cur, salt, iters); await decryptRecord(record, k0); }
  catch(e){ return setErr('Code actuel incorrect.'); }
  const pr=codeProblem(a); if(pr) return setErr(pr);
  if(a!==b) return setErr('Les deux codes ne sont pas identiques.');
  salt=crypto.getRandomValues(new Uint8Array(16)); iters=1000000; strongFlag=true; key=await deriveKey(a, salt, iters);
  closeModal(); await save(); if(keepExp){ try{ await kvSet('keep',{key,exp:keepExp}); }catch(e){} }
  renderWarn(); toast('✓ Code secret changé');
}
function dateTag(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
async function doBackup(){
  try{
    const rec=await encryptRecord();
    await saveBlobAs('coffre-sauvegarde-legere-'+dateTag()+'.json', new Blob([JSON.stringify(rec)], {type:'application/json'}));
    try{ localStorage.setItem('coffre_lastbk', String(Date.now())); }catch(e){}
    closeModal(); renderWarn();
  }catch(e){ if(!(e&&e.code==='declined')) toast('Échec de la sauvegarde'); }
}
async function doBackupFull(){
  try{
    toast('Préparation de la sauvegarde… patiente un instant');
    const rec=await encryptRecord();
    const entries=[], parts=[]; let off=0;
    const ids=[]; items.forEach(it=>filesOfItem(it).forEach(id=>ids.push(id)));
    for(const id of ids){
      const r=await fGet(id); if(!r) continue;
      const ct=new Uint8Array(r.ct);
      entries.push({id, iv:b64(r.iv), k:(r.k?1:0), off, len:ct.length});
      parts.push(ct); off+=ct.length;
    }
    const header=new TextEncoder().encode(JSON.stringify({v:2, record:rec, files:entries}));
    const lenBuf=new Uint8Array(4); new DataView(lenBuf.buffer).setUint32(0, header.length);
    const magic=new TextEncoder().encode('COFFRE2\n');
    const blob=new Blob([magic, lenBuf, header].concat(parts), {type:'application/octet-stream'});
    await saveBlobAs('coffre-sauvegarde-complete-'+dateTag()+'.coffre', blob);
    try{ localStorage.setItem('coffre_lastfull', String(Date.now())); localStorage.setItem('coffre_lastbk', String(Date.now())); }catch(e){}
    closeModal(); renderWarn();
    toast('✓ Sauvegarde complète : '+entries.length+' fichier(s) inclus');
  }catch(e){ if(!(e&&e.code==='declined')) toast('Échec de la sauvegarde complète'); }
}
let pendingFull=null;
function restoreModal(){
  openModal(`<h2>Restaurer la sauvegarde</h2>
    <div class="warn">Le contenu actuel du coffre sera remplacé par celui de la sauvegarde.</div>

    <div class="err" id="err"></div>
    <div class="row2" style="margin-top:14px"><button onclick="closeModal()">Annuler</button><button class="primary" style="margin-top:0" onclick="doRestore()">Restaurer</button></div>`);
}
async function onRestoreFile(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  pendingFull=null;
  try{
    const head=new TextDecoder().decode(new Uint8Array(await f.slice(0,8).arrayBuffer()));
    if(head==='COFFRE2\n'){
      const len=new DataView(await f.slice(8,12).arrayBuffer()).getUint32(0);
      const h=JSON.parse(new TextDecoder().decode(new Uint8Array(await f.slice(12,12+len).arrayBuffer())));
      if(!h.record||!h.record.salt||!h.record.iv||!h.record.data) throw 0;
      pendingRestore=h.record; pendingFull={file:f, base:12+len, files:h.files||[]};
      restoreModal(); return;
    }
    const rec=JSON.parse(await f.text());
    if(!rec.salt||!rec.iv||!rec.data) throw 0;
    pendingRestore=rec; restoreModal();
  }catch(e){ toast('Ce fichier n\'est pas une sauvegarde valide'); }
}
async function doRestore(){
  const p=$('#rp').value; if(!p||!pendingRestore) return;
  try{
    const s=unb64(pendingRestore.salt), it=pendingRestore.it||310000, k=await deriveKey(normCode(p), s, it);
    items=await decryptRecord(pendingRestore, k); key=k; salt=s; iters=it; strongFlag=!!pendingRestore.s; pendingRestore=null;
    try{ await initDataKey(); }catch(e){}
    if(pendingFull){
      toast('Remise des photos et fichiers…');
      const pf=pendingFull; pendingFull=null;
      for(const e of pf.files){
        try{ const ct=await pf.file.slice(pf.base+e.off, pf.base+e.off+e.len).arrayBuffer(); await fPut(e.id,{iv:unb64(e.iv), ct, k:(e.k?1:0)}); }catch(x){}
      }
    }
    closeModal(); openId=null; renderMain(); await save(); if(keepExp){ try{ await kvSet('keep',{key,exp:keepExp}); }catch(e){} }
  }catch(e){ setErr('Code incorrect pour cette sauvegarde.'); }
}

/* ---------- Démarrage ---------- */
(async function boot(){
  await initStore();
  record = await loadRecord();
  if(record){
    // si le coffre n'existait que sur cet appareil, on le copie aussi en ligne
    if(docRef()){ try{ const s=await docRef().get(); if(!s.exists || (record.ts||0) > (((s.data()||{}).ts)||0)) await docRef().set(record); }catch(e){} }
    try{
      const kv = await kvGet('keep');
      if(kv && kv.exp>Date.now()){
        try{
          items = await decryptRecord(record, kv.key); items.forEach(i=>{i.locked=true;}); strongFlag=!!record.s; key=kv.key; salt=unb64(record.salt); iters=record.it||310000;
          keepExp=kv.exp; keepT=setTimeout(lock, Math.max(1000, kv.exp-Date.now()));
          try{ await initDataKey(); }catch(e){}
          renderMain(); return;
        }catch(e){ await kvDel('keep'); }
      } else if(kv){ await kvDel('keep'); }
    }catch(e){}
    renderLock();
  } else renderSetup();
})();
</script>
