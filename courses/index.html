<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caddie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caddie">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Une colonne : liste groupée par rayon, barre d'ajout fixée en bas. Palette des applis Dépenses / Coffre. */
  :root{
    --bg:#0c0c0e; --surface:#17171a; --surface2:#1f1e1c; --line:#33302a;
    --text:#f3ead6; --dim:#a69c86; --brass:#c89b3c; --brass2:#e2bd6a; --green:#5f9e79; --red:#c4635a;
    --sans:"Source Sans 3",system-ui,-apple-system,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{margin:0; min-height:100vh; color:var(--text); font-family:var(--sans); font-size:16px; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg);}
  .wrap{max-width:640px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0 calc(190px + env(safe-area-inset-bottom,0px));}
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:22px 0 14px;}
  h1{font-family:var(--serif); font-weight:600; font-size:2rem; margin:0; letter-spacing:-.01em;}
  .count{color:var(--dim); font-size:.9rem; margin-top:2px;}
  .count b{color:var(--brass2); font-weight:600;}
  .seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px;}
  .seg button{border:0; background:none; color:var(--dim); font:inherit; font-size:.8rem; padding:6px 11px; border-radius:999px; cursor:pointer;}
  .seg button.on{background:var(--surface2); color:var(--text);}

  .tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; margin:0 0 6px;}
  .tabs button{flex:1; border:0; background:none; color:var(--dim); font:inherit; font-size:.92rem; font-weight:500; padding:10px 8px; border-radius:9px; cursor:pointer;}
  .tabs button.on{background:var(--surface2); color:var(--brass2);}
  .tabs .n{font-size:.78rem; color:var(--dim); margin-left:4px; font-variant-numeric:tabular-nums;}
  .search{width:100%; margin:8px 0 2px; padding:12px 14px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; color:var(--text); font:inherit;}
  .search:focus{outline:none; border-color:var(--brass);}
  .old .sub{display:block; font-size:.78rem; color:var(--dim); margin-top:2px;}
  .old .name{cursor:default;}
  .addold{flex:none; font:inherit; font-size:.88rem; font-weight:600; height:36px; padding:0 12px; border-radius:10px; cursor:pointer; background:none; border:1px solid var(--brass); color:var(--brass2);}
  .inlist{flex:none; font-size:.82rem; color:var(--green); padding:0 6px;}
  .group{margin-top:14px;}
  .ghead{display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); margin:0 0 8px 4px;}
  .ghead span.n{color:var(--line); font-variant-numeric:tabular-nums;}
  .list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .item{display:flex; align-items:center; gap:12px; padding:10px 8px 10px 10px; border-top:1px solid var(--line); min-height:58px; touch-action:pan-y; transition:transform .18s ease, opacity .18s ease; background:var(--surface);}
  .item:first-child{border-top:0;}
  .check{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; background:none; padding:0; cursor:pointer;}
  .check svg{width:14px; height:14px; opacity:0;}
  .emo{flex:none; width:38px; height:38px; border-radius:10px; background:var(--surface2); display:grid; place-items:center; font-size:1.35rem; line-height:1;}
  .name{flex:1; min-width:0; font-size:1rem; overflow-wrap:anywhere; cursor:pointer; padding:6px 0;}
  .qty{flex:none; display:flex; align-items:center; background:var(--surface2); border:1px solid var(--line); border-radius:999px; height:32px;}
  .qty button{border:0; background:none; color:var(--dim); width:30px; height:30px; font-size:1.1rem; cursor:pointer; padding:0;}
  .qty .v{min-width:26px; text-align:center; font-variant-numeric:tabular-nums; font-size:.9rem; color:var(--text);}
  .qty.one .v{display:none;}
  .qty.one .minus{display:none;}
  .del{flex:none; border:0; background:none; color:var(--dim); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:1rem; padding:0;}
  .del:active{color:var(--red);}
  .item.done .check{border-color:var(--green); background:var(--green);}
  .item.done .check svg{opacity:1;}
  .item.done .name{color:var(--dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .item.done .emo{opacity:.45; filter:grayscale(.6);}
  .item.done .qty{display:none;}
  .item.swiping{transition:none;}

  .basket-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 8px 4px;}
  .basket-head .ghead{margin:0; color:var(--green);}
  .linkbtn{border:0; background:none; color:var(--brass); font:inherit; font-size:.85rem; cursor:pointer; padding:6px 4px;}

  .empty{text-align:center; padding:56px 16px 24px; color:var(--dim);}
  .empty .big{font-size:3rem;}
  .empty h2{font-family:var(--serif); font-weight:600; color:var(--text); font-size:1.35rem; margin:10px 0 6px;}
  .empty p{margin:0 auto; max-width:30ch; line-height:1.5; font-size:.95rem;}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:5; background:linear-gradient(to top, var(--bg) 70%, transparent);
    padding:28px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
  .bar-in{max-width:640px; margin:0 auto;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:7px 12px 7px 10px; font:inherit; font-size:.88rem; cursor:pointer; white-space:nowrap;}
  .chip:active{border-color:var(--brass);}
  .chip .plus{color:var(--brass);}
  form.add{display:flex; gap:8px; align-items:center; background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:6px 6px 6px 8px;}
  form.add:focus-within{border-color:var(--brass);}
  .preview{flex:none; width:38px; height:38px; display:grid; place-items:center; font-size:1.4rem; border-radius:10px; transition:transform .15s ease;}
  .preview.pop{transform:scale(1.18);}
  #newItem{flex:1; min-width:0; border:0; background:none; color:var(--text); font:inherit; font-size:1rem; padding:10px 2px; outline:none;}
  #newItem::placeholder{color:var(--dim);}
  .addbtn{flex:none; background:var(--brass); color:#1a1508; border:0; border-radius:10px; font:inherit; font-weight:600; padding:0 16px; height:42px; cursor:pointer;}
  .addbtn:disabled{opacity:.4;}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(150px + env(safe-area-inset-bottom,0px)); z-index:6;
    background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:10px 10px 10px 14px; display:flex; gap:12px; align-items:center;
    font-size:.92rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .toast button{border:0; background:none; color:var(--brass2); font:inherit; font-weight:600; cursor:pointer; padding:4px 6px;}

  .ask{flex:none; display:flex; gap:6px; align-items:center;}
  .ask button{font:inherit; font-size:.88rem; border-radius:10px; height:38px; padding:0 12px; cursor:pointer; border:1px solid var(--line); background:var(--surface2); color:var(--dim);}
  .ask .yes{background:var(--brass); border-color:var(--brass); color:#1a1508; font-weight:600;}
  .ask .yes.back{background:var(--surface2); border-color:var(--brass); color:var(--brass2);}
  .ask .yes.red{background:var(--red); border-color:var(--red); color:#fff;}
  .item.asking.deling{box-shadow:inset 3px 0 0 var(--red);}
  .item.asking{background:var(--surface2); box-shadow:inset 3px 0 0 var(--brass);}
  .item.asking .emo{background:var(--surface);}
  .item.asking .check{display:none;}
  .item.asking .name{overflow-wrap:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  @media (max-width:380px){ .ask button{padding:0 9px; font-size:.82rem;} }

  [hidden]{display:none!important;}
  .emo{border:0; color:inherit; cursor:pointer; padding:0;}
  .sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:640px; max-height:70vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
  .sheet h3{font-family:var(--serif); font-weight:600; margin:0 0 4px; font-size:1.2rem;}
  .sheet p{margin:0 0 12px; color:var(--dim); font-size:.88rem;}
  .grid{overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px;}
  .grid button{border:1px solid transparent; background:var(--surface2); border-radius:10px; height:48px; font-size:1.5rem; cursor:pointer; padding:0;}
  .grid button.on{border-color:var(--brass);}
  button:focus-visible,.name:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* Thème Métro Dodo : écriture dorée, or dégradé, noir chaud */
:root{--bg:#0c0c0e;--surface:#17171a;--surface2:#1f1e1c;--line:#33302a;--text:#f3ead6;--dim:#a69c86;--brass:#d4a94e;--brass2:#e2c275;--brass-dim:#8f7331;
--s:#17171a;--s2:#1f1e1c;--gold:#d4a94e;--gold2:#e2c275;--mdgold:linear-gradient(135deg,#f7e3a1 0%,#d4a94e 45%,#a87b2c 72%,#ecd08a 100%)}
html,body{background:radial-gradient(120% 60% at 30% 0%,#26241f 0%,#0c0c0e 60%) fixed,#0c0c0e!important}
html{font-size:106.25%}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
*{font-variant-numeric:lining-nums}
h1,.titre-or{font-family:"Cormorant Garamond","DejaVu Serif",Georgia,serif!important;background:var(--mdgold);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:600!important;letter-spacing:.01em}
h1 button,h1 span,h1 a{color:var(--text)}
.addbtn,.ask .yes,.tabs button.on,.seg button.on{background:var(--mdgold)!important;color:#111113!important;border-color:transparent!important}
.tabs button:not(.on),.seg button:not(.on){color:var(--brass2)}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Caddie</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" id="vRayon" class="on">Rayons</button>
      <button type="button" id="vListe">Liste</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Onglets">
    <button type="button" id="tList" class="on">Ma liste</button>
    <button type="button" id="tOld">Anciens achats<span class="n" id="oldN"></span></button>
  </nav>
  <main id="main"></main>
  <section id="old" hidden>
    <input class="search" id="oldSearch" type="search" placeholder="Chercher un ancien achat…" aria-label="Chercher un ancien achat" autocomplete="off">
    <div id="oldList"></div>
  </section>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="chips" id="chips" aria-label="Souvent acheté"></div>
    <form class="add" id="addForm" autocomplete="off">
      <div class="preview" id="preview" aria-hidden="true">🛒</div>
      <input id="newItem" type="text" placeholder="Ajouter… (ex : 3 pommes)" enterkeyhint="done" aria-label="Produit à ajouter">
      <button class="addbtn" id="addBtn" type="submit" disabled>Ajouter</button>
    </form>
  </div>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Choisir l’emoji</h3>
    <p id="sheetSub">Il sera gardé pour la prochaine fois.</p>
    <div class="grid" id="emoGrid"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastBtn">Annuler</button></div>

function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae')
    .replace(/['’\-_.,;:!?()]/g,' ').replace(/\s+/g,' ').trim();
}
function sing(w){ if(w.length>3 && /(s|x)$/.test(w)) return w.slice(0,-1); return w; }
function toks(s){ return norm(s).split(' ').filter(Boolean).map(sing); }
const DICT = DICT_SRC.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{
  const [k,e,c] = x.split('|'); return {t:toks(k), e, c};
});
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) cur[j]=Math.min(cur[j],prev[j-2]+1);
      rowMin=Math.min(rowMin,cur[j]);
    }
    if(rowMin>max) return max+1; prev=cur;
  }
  return prev[b.length];
}
// 0 = identique, 1 = faute de frappe, 2 = début du mot (en train d'écrire), -1 = différent
function close(w,k,last){
  if(w===k) return 0;
  if(k.length>=4 && w.length>=3){
    const tol = k.length>=7 ? 2 : 1;
    if(lev(w,k,tol)<=tol) return 1;
  }
  if(last && w.length>=3 && k.startsWith(w)) return 2;
  return -1;
}
function guess(name){
  const t = toks(name); if(!t.length) return null;
  let best=null;
  for(const d of DICT){
    const L=d.t.length;
    for(let i=0;i+L<=t.length;i++){
      let ok=true, pen=0;
      for(let j=0;j<L;j++){ const r=close(t[i+j],d.t[j], i+j===t.length-1); if(r<0){ok=false;break;} pen+=r; }
      if(ok){
        // le premier mot compte le plus (« yaourt à la fraise » = yaourt), puis le plus long, puis le plus exact
        const score = -i*10 + L*2 - pen;
        if(!best || score>best.s) best={e:d.e,c:d.c,s:score};
        break;
      }
    }
  }
  return best;
}

function parse(raw){
  let s = raw.trim().replace(/\s+/g,' '); let q=1, m;
  if((m = s.match(/^(\d{1,2})\s+(?!(?:kg|g|gr|l|cl|ml)\b)(.+)$/i))){ q=+m[1]; s=m[2]; }
  else if((m = s.match(/^(.+?)\s*[x×*]\s*(\d{1,2})$/i))){ s=m[1]; q=+m[2]; }
  s = s.charAt(0).toUpperCase()+s.slice(1);
  return {name:s, qty:Math.max(1,Math.min(99,q||1))};
}

function addItem(raw){
  const p=parse(raw); if(!p.name) return;

    state.items.unshift({id:uid(), name:p.name, qty:p.qty, done:false, emo:(h&&h.custom&&h.emo)||(g&&g.e)||(h&&h.emo)||'🛒', cat:(g&&g.c)||(h&&h.cat)||'z'});

/* ---------- Rendu ---------- */
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="#0c0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function row(it){
  const asking = askId===it.id, del = asking && askMode==='del';
  return `<div class="item${it.done?' done':''}${asking?' asking':''}${del?' deling':''}" data-id="${it.id}">
    <button class="check" data-act="toggle" aria-label="${it.done?'Remettre':'Cocher'} ${esc(it.name)}">${CHECK}</button>
    <button class="emo" data-act="emo" aria-label="Changer l’emoji">${it.emo}</button>
    <div class="name" data-act="toggle" tabindex="-1">${esc(it.name)}</div>
    ${asking ? `<div class="ask">
      <button type="button" data-act="no">Non</button>
      ${del ? `<button type="button" class="yes red" data-act="yes">Supprimer</button>` : `<button type="button" class="yes${it.done?' back':''}" data-act="yes">${it.done?'Remettre':'Au panier'}</button>`}
    </div>` : `<div class="qty${it.qty<=1?' one':''}">
      <button class="minus" data-act="minus" aria-label="Moins">−</button><span class="v">×${it.qty}</span><button data-act="plus" aria-label="Plus">+</button>
    </div>
    <button class="del" data-act="del" aria-label="Supprimer ${esc(it.name)}">✕</button>`}
  </div>`;
}
function render(){
  const abc=(x,y)=>x.name.localeCompare(y.name,'fr',{sensitivity:'base',numeric:true});
  const todo=state.items.filter(i=>!i.done).sort(abc), done=state.items.filter(i=>i.done).sort(abc);
  $('count').innerHTML = state.items.length
    ? (todo.length ? `<b>${todo.length}</b> à acheter${done.length?` · ${done.length} dans le panier`:''}` : `Tout est dans le panier 🎉`)
    : 'Liste vide';
  $('vRayon').classList.toggle('on', state.view==='rayon'); $('vListe').classList.toggle('on', state.view!=='rayon');
  let html='';
  if(!state.items.length){
    html=`<div class="empty"><div class="big">🧺</div><h2>Rien à acheter</h2><p>Tape un produit en bas, l’emoji et le rayon se mettent tout seuls.</p></div>`;
  } else {
    if(todo.length){
      if(state.view==='rayon'){
        for(const c of CAT_ORDER){
          const g=todo.filter(i=>i.cat===c); if(!g.length) continue;
          html+=`<section class="group"><div class="ghead">${CATS[c].label} <span class="n">${g.length}</span></div><div class="list">${g.map(row).join('')}</div></section>`;
        }
      } else {
        html+=`<section class="group"><div class="list">${todo.map(row).join('')}</div></section>`;
      }
    }
    if(done.length){
      html+=`<div class="basket-head"><div class="ghead">✓ Dans le panier <span class="n">${done.length}</span></div>${askClear ? `<div class="ask"><button type="button" data-act="clearNo">Non</button><button type="button" class="yes red" data-act="clearYes">Vider</button></div>` : `<button class="linkbtn" data-act="clear">Vider le panier</button>`}</div>
        <div class="list">${done.map(row).join('')}</div>`;
    }
  }
  main.innerHTML=html;
  renderChips();
  renderTabs();
}

/* ---------- Onglet « Anciens achats » ---------- */
let tab='list', forgetKey=null;
function renderTabs(){
  const isOld = tab==='old';
  $('tList').classList.toggle('on',!isOld); $('tOld').classList.toggle('on',isOld);
  main.hidden=isOld; $('old').hidden=!isOld; $('bar').hidden=isOld;
  document.querySelector('.seg').style.visibility = isOld ? 'hidden' : '';
  const nOld=Object.keys(state.hist).length; $('oldN').textContent = nOld ? nOld : '';
  if(isOld){ $('count').innerHTML = nOld ? `<b>${nOld}</b> produits déjà achetés` : 'Aucun ancien achat'; renderOld(); }
}
function renderOld(){
  const inList=new Set(state.items.filter(i=>!i.done).map(i=>norm(i.name)));
  const q=norm($('oldSearch').value);
  const all=Object.entries(state.hist).map(([k,h])=>({k,...h})).filter(h=>!q||h.k.includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base',numeric:true}));
  let html='';
  if(!Object.keys(state.hist).length){
    html=`<div class="empty"><div class="big">🧾</div><h2>Pas encore d’anciens achats</h2><p>Chaque produit que tu ajoutes à ta liste sera gardé ici pour la prochaine fois.</p></div>`;
  } else if(!all.length){
    html=`<div class="empty"><p>Rien ne correspond à « ${esc($('oldSearch').value)} ».</p></div>`;
  } else {
    for(const c of CAT_ORDER){
      const g=all.filter(h=>(h.cat||'z')===c); if(!g.length) continue;
      html+=`<section class="group"><div class="ghead">${CATS[c].label} <span class="n">${g.length}</span></div><div class="list">${g.map(h=>{
        const asking=forgetKey===h.k;
        const right = asking
          ? `<div class="ask"><button type="button" data-oact="forgetNo">Non</button><button type="button" class="yes red" data-oact="forgetYes">Oublier</button></div>`
          : (inList.has(h.k) ? `<span class="inlist">✓ Dans la liste</span>` : `<button type="button" class="addold" data-oact="add">+ Ajouter</button>`)
            + `<button class="del" data-oact="forget" aria-label="Oublier ${esc(h.name)}">✕</button>`;
        return `<div class="item old${asking?' asking deling':''}" data-key="${esc(h.k)}">
          <div class="emo" style="display:grid">${h.emo||'🛒'}</div>
          <div class="name">${esc(h.name)}<span class="sub">Acheté ${h.n>1?h.n+' fois':'1 fois'}</span></div>
          ${right}
        </div>`;}).join('')}</div></section>`;
    }
  }
  $('oldList').innerHTML=html;
}
$('oldList').addEventListener('click',e=>{
  const b=e.target.closest('[data-oact]'); const r=e.target.closest('.item');
  if(!b||!r){ if(forgetKey){ forgetKey=null; renderOld(); } return; }
  const k=r.dataset.key, h=state.hist[k]; const a=b.dataset.oact;
  if(a==='add' && h){ addItem(h.name); }
  else if(a==='forget'){ forgetKey=k; renderOld(); }
  else if(a==='forgetNo'){ forgetKey=null; renderOld(); }
  else if(a==='forgetYes'){ forgetKey=null; delete state.hist[k]; store.save(); render(); }
});
$('oldSearch').addEventListener('input',renderOld);
$('tList').addEventListener('click',()=>{ tab='list'; forgetKey=null; render(); window.scrollTo(0,0); });
$('tOld').addEventListener('click',()=>{ tab='old'; askId=null; render(); window.scrollTo(0,0); });
function renderChips(){
  const inList=new Set(state.items.filter(i=>!i.done).map(i=>norm(i.name)));
  const q=norm(input.value);
  if(!q){ chips.innerHTML=''; chips.hidden=true; return; }
  let list=Object.entries(state.hist).filter(([k])=>!inList.has(k));
  if(q) list=list.filter(([k])=>k.includes(q) && k!==q);
  list.sort((a,b)=>(b[1].n-a[1].n)||(b[1].t-a[1].t));
  list=list.slice(0,10);
  chips.innerHTML=list.map(([k,h])=>`<button type="button" class="chip" data-key="${esc(k)}"><span>${h.emo}</span>${esc(h.name)}<span class="plus">+</span></button>`).join('');
  chips.hidden=!list.length;
}

/* ---------- Événements ---------- */
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(askId && (!b || !b.closest('.item') || b.closest('.item').dataset.id!==askId) && !(b && (b.dataset.act==='toggle'||b.dataset.act==='del'))){ askId=null; render(); if(!b) return; }
  if(!b) return;
  if(b.dataset.act==='clear'){ askClear=true; render(); return; }
  if(b.dataset.act==='clearNo'){ askClear=false; render(); return; }
  if(b.dataset.act==='clearYes'){ askClear=false; clearBasket(); return; }
  const row=b.closest('.item'); if(!row) return; const id=row.dataset.id;
  ({emo:()=>openPicker(id), toggle:()=>ask(id), yes:()=>{ if(askMode==='del'){ askId=null; removeItem(id); } else toggle(id); }, no:()=>{askId=null; render();}, plus:()=>setQty(id,1), minus:()=>setQty(id,-1), del:()=>ask(id,'del')})[b.dataset.act]?.();
});
chips.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return; const h=state.hist[c.dataset.key]; if(h){ addItem(h.name); input.value=''; updatePreview(); }
});
$('addForm').addEventListener('submit',e=>{ e.preventDefault(); if(!input.value.trim()) return; addItem(input.value); input.value=''; updatePreview(); input.focus(); });
let lastEmo='🛒';
function updatePreview(){
  const v=input.value.trim(); addBtn.disabled=!v;
  let emo='🛒';
  if(v){ const p=parse(v), g=guess(p.name), h=state.hist[norm(p.name)]; emo=(h&&h.custom&&h.emo)||(g&&g.e)||(h&&h.emo)||'🛒'; }
  if(emo!==lastEmo){ preview.textContent=emo; preview.classList.add('pop'); setTimeout(()=>preview.classList.remove('pop'),150); lastEmo=emo; }
  renderChips();
}
input.addEventListener('input',updatePreview);
$('vRayon').addEventListener('click',()=>{ state.view='rayon'; store.save(); render(); });
$('vListe').addEventListener('click',()=>{ state.view='liste'; store.save(); render(); });

document.addEventListener('click',e=>{ if(askId && !e.target.closest('#main')){ askId=null; render(); } }, true);

/* Choisir l'emoji soi-même */
const EXTRA_EMO='🍎🍏🍐🍊🍋🍌🍉🍇🍓🫐🍈🍒🍑🥭🍍🥥🥝🍅🍆🥑🫒🥦🥬🥒🌶️🫑🌽🥕🧄🧅🥔🍠🫚🫛🫘🥜🌰🍄🌿🌱🍞🥐🥖🫓🥨🥯🥞🧇🧀🍖🍗🥩🥓🍔🍟🍕🌭🥪🌮🌯🥙🧆🥚🍳🥘🍲🥣🥗🍿🧈🧂🥫🍱🍘🍙🍚🍛🍜🍝🍣🍤🍥🥟🦪🦀🦞🦐🦑🐟🍦🍧🍨🍩🍪🎂🍰🧁🥧🍫🍬🍭🍮🍯🍼🥛☕🫖🍵🧃🥤🧋🍶🍺🍻🥂🍷🥃🍸🍹🍾🧊💧🧴🧼🪥🧻🧽🧹🧺🗑️💊🩹💄🪒🔋💡🕯️🐾🐱🐶👶🛒🛍️🎁💐';
let pickId=null;
function openPicker(id){
  const it=state.items.find(i=>i.id===id); if(!it) return; pickId=id;
  const set=[]; for(const ch of Array.from(new Intl.Segmenter('fr',{granularity:'grapheme'}).segment(EXTRA_EMO),x=>x.segment)) if(!set.includes(ch)) set.push(ch);
  for(const d of DICT) if(!set.includes(d.e)) set.push(d.e);
  $('sheetTitle').textContent='Emoji pour « '+it.name+' »';
  $('emoGrid').innerHTML=set.map(e=>`<button type="button" class="${e===it.emo?'on':''}">${e}</button>`).join('');
  $('sheet').hidden=false;
}
$('emoGrid').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const it=state.items.find(i=>i.id===pickId);
  if(it){ it.emo=b.textContent; const k=norm(it.name); const h=state.hist[k]||{name:it.name,n:0,cat:it.cat,t:Date.now()}; h.emo=it.emo; h.custom=true; state.hist[k]=h; store.save(); render(); }
  $('sheet').hidden=true;
});
$('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') $('sheet').hidden=true; });

/* Glisser vers la gauche pour supprimer */
let sw=null;
main.addEventListener('touchstart',e=>{ const r=e.target.closest('.item'); if(!r||e.target.closest('button')) return; sw={r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0}; },{passive:true});
main.addEventListener('touchmove',e=>{ if(!sw) return; const dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(sw.dx)<8){ sw=null; return; }
  sw.dx=Math.min(0,dx); sw.r.classList.add('swiping'); sw.r.style.transform=`translateX(${sw.dx}px)`; sw.r.style.opacity=String(1+sw.dx/300); },{passive:true});
main.addEventListener('touchend',()=>{ if(!sw) return; const {r,dx}=sw; sw=null; r.classList.remove('swiping');
  if(dx<-110){ r.style.transform=''; r.style.opacity=''; ask(r.dataset.id,'del'); }
  else { r.style.transform=''; r.style.opacity=''; } });

/* Exemple au tout premier lancement, pour voir à quoi ça ressemble */
if(!store.load() && !state.items.length){
  ['Bananes','6 œufs','Lait','Baguette','Tomates','Poulet','Café','Papier toilette'].forEach(addItem);
  state.items.find(i=>i.name==='Lait').done=true; store.save();
}
render(); updatePreview();

/* Hors connexion (quand l'appli est installée) */
if('serviceWorker' in navigator && location.protocol==='https:'){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
})();
</script>
</body>
</html>
