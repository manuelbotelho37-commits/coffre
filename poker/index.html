<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Win</title>
<meta name="theme-color" content="#09151F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09151F; --bg2:#10283B; --panel:#0F2030; --panel2:#0B1823; --line:#23425A;
  --ink:#EAF4FB; --dim:#8CA5B9; --accent:#62B6E8; --gain:#3ED3A0; --loss:#F0716A; --gold:#E6C068;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg)}
body{
  min-height:100%; margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4;
  background:radial-gradient(130% 55% at 50% 0%, #1F4A68 0%, rgba(31,74,104,0) 62%), linear-gradient(#0C1B29,#08131D);
  background-color:var(--bg); -webkit-tap-highlight-color:transparent; padding:60px 0 84px;
}
button{font-family:inherit; color:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* barre du haut */
#top{position:fixed; top:0; left:0; right:0; z-index:20; padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px; height:calc(env(safe-area-inset-top,0px) + 56px);
  display:flex; align-items:center; gap:6px; background:rgba(9,21,31,.94); backdrop-filter:blur(8px); border-bottom:1px solid rgba(98,182,232,.12)}
#top .iconbtn{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:12px}
#top .iconbtn:active{background:rgba(98,182,232,.12)}
#ttl{flex:1; font-family:var(--display); font-weight:600; font-size:1.08rem; text-align:center}
#topRight{min-width:44px; height:44px; display:flex; justify-content:flex-end}
#top .xbtn{font-size:1.3rem; font-weight:700; color:var(--ink)}
.sheet-x.inline{position:static; float:none; margin:0 0 0 auto}

/* navigation du bas */
#nav{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; justify-content:space-around;
  padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px); background:rgba(9,21,31,.96); backdrop-filter:blur(8px); border-top:1px solid rgba(98,182,232,.14)}
#nav button{flex:1; max-width:110px; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:var(--dim); font-size:.72rem; border-radius:12px}
#nav button.on{color:var(--accent)}
#nav button.on .ic{stroke-width:2.2}

#fab{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 82px); z-index:19; width:58px; height:58px; border-radius:50%; border:0;
  background:linear-gradient(145deg,#74C4F0,#4A9FD4); color:#06121B; display:none; place-items:center; box-shadow:0 8px 22px rgba(0,0,0,.45)}
#fab .ic{width:28px;height:28px;stroke-width:2.4}
#fab.show{display:grid}
#fab.locked{background:#2A3E50; color:#8CA5B9; box-shadow:none}

main{max-width:780px; margin:0 auto; padding:14px 14px 80px}
.page-in{animation:fadeIn .22s ease-out}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.page-in{animation:none}}

/* onglets */
.tabs{display:flex; gap:4px; overflow-x:auto; margin:0 -14px 14px; padding:0 14px; border-bottom:1px solid var(--line); scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none; border:0; background:none; padding:12px 14px; color:var(--dim); font-weight:600; font-size:.95rem; border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}

/* blocs */
.box{background:var(--panel); border:1px solid rgba(98,182,232,.1); border-radius:18px; padding:16px; margin-bottom:14px}
.box h3{margin:0 0 10px; font-family:var(--display); font-size:1rem; font-weight:600}
.box h3.center{text-align:center}
.gain{color:var(--gain)} .loss{color:var(--loss)} .dim{color:var(--dim)}
.tbl{width:100%; border-collapse:collapse}
.tbl th{font-weight:600; color:var(--dim); font-size:.82rem; text-align:right; padding:0 0 8px}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 0; text-align:right; border-top:1px solid rgba(35,66,90,.7); font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left; color:var(--ink)}
.tbl tr:nth-child(odd) td{background:rgba(255,255,255,.015)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat .v{font-family:var(--display); font-weight:600; font-size:1.2rem; font-variant-numeric:tabular-nums}
.stat .l{color:var(--dim); font-size:.8rem; margin-top:2px}
.empty{text-align:center; color:var(--dim); padding:22px 10px}
.empty b{display:block; color:var(--ink); font-size:1.05rem; margin-bottom:6px}

/* accueil */
.hero{position:relative; border-radius:22px; overflow:hidden; margin-bottom:14px; background:linear-gradient(160deg,#143550,#0E2335); border:1px solid rgba(98,182,232,.18); padding:14px 16px 6px; cursor:pointer}
.hero .hi{color:var(--dim); font-size:.95rem}
.hero .big{font-family:var(--display); font-weight:700; font-size:2rem; letter-spacing:-.02em; line-height:1.1; margin:2px 0 4px; font-variant-numeric:tabular-nums}
.hero .sub{color:var(--dim); font-size:.9rem}
.hero svg.curve{margin:6px -16px 0; width:calc(100% + 32px)}
.hero .row > *{flex:initial}
svg.curve{width:100%}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#F0D58A,#C99A3A); display:grid; place-items:center; color:#1A1203; font-size:1.2rem; font-weight:700}
.brand span{font-family:var(--display); font-weight:700; letter-spacing:.01em}
.sess-head{display:flex; justify-content:space-between; gap:10px; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--line)}
.sess-head .t{font-size:1.15rem; font-weight:600} .sess-head .r{text-align:right; font-weight:600}
.kv{display:grid; grid-template-columns:repeat(3,1fr); gap:16px 10px}
.kv .k{font-family:var(--display); font-weight:600; font-size:1.05rem; font-variant-numeric:tabular-nums}
.kv .n{color:var(--dim); font-size:.78rem}
.kv > div:nth-child(3n){text-align:right} .kv > div:nth-child(3n+2){text-align:center}

.btn{border:1.5px solid var(--accent); background:none; color:var(--accent); border-radius:999px; padding:13px 20px; font-weight:700; font-size:1rem}
.btn:active{background:rgba(98,182,232,.14)}
.btn.solid{background:linear-gradient(145deg,#74C4F0,#4A9FD4); border-color:transparent; color:#06121B}
.btn.danger{border-color:var(--loss); color:var(--loss)}
.btn.block{display:block; width:100%}
.btn.sm{padding:8px 14px; font-size:.9rem}
.row{display:flex; gap:10px; align-items:center}
.row > *{flex:1}
.stack{display:flex; flex-direction:column; gap:12px}

/* listes */
.item{display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%; text-align:left; background:var(--panel); border:1px solid rgba(98,182,232,.1); border-radius:16px; padding:14px 16px; margin-bottom:10px}
.item .a{font-weight:600} .item .b{color:var(--dim); font-size:.9rem}
.item .amt{font-family:var(--display); font-weight:600; font-variant-numeric:tabular-nums}
.yearchip{display:table; margin:6px auto 12px; background:rgba(255,255,255,.07); border-radius:999px; padding:6px 18px; color:var(--dim); font-weight:600}

/* formulaires */
label.f{display:block; font-size:.82rem; color:var(--accent); margin-bottom:5px; font-weight:600}
.in{width:100%; background:var(--panel2); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; min-height:48px}
.in:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
textarea.in{min-height:96px; resize:vertical}
select.in{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px; background-size:6px 6px; background-repeat:no-repeat; padding-right:36px}
.err{color:var(--loss); font-size:.9rem}

/* fenêtres */
.veil{position:fixed; inset:0; z-index:40; background:rgba(3,9,14,.66); display:none}
.veil.open{display:block}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:92%; overflow:auto; background:#0D1D2C; border-radius:22px 22px 0 0; border-top:1px solid rgba(98,182,232,.25);
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateY(105%); transition:transform .22s ease-out; max-width:780px; margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{margin:0 52px 14px 0; font-family:var(--display); font-size:1.15rem}
.sheet-x{position:sticky; top:-6px; float:right; z-index:5; width:44px; height:44px; margin:-8px -6px 0 0; border:1px solid var(--line); border-radius:50%; background:#16304A; color:var(--ink); font-size:1.1rem; font-weight:700; display:grid; place-items:center}
.sheet-x:active{background:#21486B}
#picker{z-index:61} #pickerVeil{z-index:60}
#drawer{position:fixed; top:0; bottom:0; left:0; width:min(82%,320px); z-index:51; background:#0C1B29; border-right:1px solid var(--line); transform:translateX(-105%); transition:transform .2s ease-out; padding:calc(env(safe-area-inset-top,0px) + 14px) 0 calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; flex-direction:column}
#drawer.open{transform:none}
#drawerVeil{z-index:50}
#drawer .brand{padding:6px 20px 16px}
#drawer button.dr{display:flex; align-items:center; gap:14px; width:100%; border:0; border-bottom:1px solid rgba(35,66,90,.6); background:none; padding:18px 20px; font-size:1.05rem; text-align:left}
#drawer button.dr.on{color:var(--accent)}
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 96px); transform:translateX(-50%); background:#1B3A52; border:1px solid var(--accent); padding:10px 18px; border-radius:999px; z-index:90; opacity:0; pointer-events:none; transition:opacity .2s; font-weight:600; white-space:nowrap}
#toast.on{opacity:1}

/* cartes */
.card{display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:34px; height:48px; border-radius:6px; background:#F2F6F9; color:#14202B; line-height:1; flex:none; box-shadow:0 1px 3px rgba(0,0,0,.45)}
.card b{font-size:1.05rem; font-family:var(--display)} .card i{font-style:normal; font-size:1.05rem}
.card.red{color:#D6403A}
.card.back{background:repeating-linear-gradient(135deg,#D63A2F 0 4px,#B52B22 4px 8px); border:1.5px solid #8E1F18}
.card.sm{width:24px;height:34px;border-radius:5px} .card.sm b,.card.sm i{font-size:.8rem}
.card.lg{width:44px;height:62px} .card.lg b,.card.lg i{font-size:1.25rem}
.slot{border:0; background:none; padding:0; border-radius:8px; line-height:0}
.slot:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.cards-row{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}

/* table de poker */
.table{position:relative; width:100%; aspect-ratio:.86; max-height:620px; margin:6px auto 14px}
.table .felt{position:absolute; left:14%; right:14%; top:17%; bottom:17%; border-radius:50%/42%; background:radial-gradient(#3B7090,#2C5873); border:7px solid #11354D; box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.table .brandtxt{position:absolute; left:0; right:0; top:75%; text-align:center; font-family:var(--display); font-weight:700; letter-spacing:.06em; color:rgba(8,26,40,.65); font-size:.95rem}
.table .board{position:absolute; left:0; right:0; top:42%; display:flex; justify-content:center; gap:4px}
.seat{position:absolute; transform:translate(-50%,-50%); width:84px; text-align:center; background:none; border:0; padding:0}
.seat .disc{border-radius:50%; background:#1B4B6B; border:3px solid #0E3047; padding:8px 4px 14px; width:84px; height:84px; display:flex; align-items:flex-start; justify-content:center; position:relative}
.seat.hero .disc{border-color:var(--gold)}
.seat .pos{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:.72rem; font-weight:700; background:#0E3047; padding:1px 7px; border-radius:6px}
.seat .sbet{position:absolute; left:50%; top:-26px; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:4px; background:rgba(8,26,40,.85); color:#fff; font-weight:700; font-size:.78rem; padding:3px 8px 3px 4px; border-radius:999px; white-space:nowrap}
.seat .sbet.below{top:auto; bottom:-12px}
.seat .sbet i{width:14px; height:14px; border-radius:50%; background:#E8C547; border:3px dashed #fff; box-sizing:border-box; flex:none}
.seat .sbet.opt{background:#7A4CC2}
.table.edit{margin-top:40px; margin-bottom:28px}
.memo{display:flex; justify-content:flex-end; align-items:center; gap:6px; margin:-6px 0 14px}
.memo .lbl{font-size:.75rem; color:var(--dim); text-align:right; line-height:1.15}
.memo .cards-row{gap:3px; flex-wrap:nowrap}
.stkin{position:absolute; transform:translate(-50%, calc(-50% + 46px)); z-index:4}
.stkin input{width:66px; height:22px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(8,26,40,.85); color:#BFE0F5; text-align:center; font-weight:700; font-size:.74rem; padding:0 4px; box-sizing:border-box; -moz-appearance:textfield; appearance:textfield}
.stkin input::-webkit-inner-spin-button,.stkin input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
.stkin input::placeholder{color:rgba(191,224,245,.5); font-weight:600}
.stkin input.has{background:#0E3047; color:#fff; border-color:#BFE0F5}
.table.edit .brandtxt{display:none}
.betin{position:absolute; transform:translate(-50%, calc(-50% - 58px)); z-index:4; display:flex; gap:3px; align-items:center}
.betin input{width:48px; height:26px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(8,26,40,.85); color:#fff; text-align:center; font-weight:700; font-size:.8rem; padding:0 3px; box-sizing:border-box; -moz-appearance:textfield; appearance:textfield}
.betin input::-webkit-inner-spin-button,.betin input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
.betin input::placeholder{color:rgba(255,255,255,.55); font-weight:600}
.betin input.has{background:#E8C547; color:#0E3047; border-color:#fff}
.betin input.has::placeholder{color:rgba(14,48,71,.8)}
.betin .ob{height:26px; padding:0 5px; border-radius:999px; font-size:.58rem; font-weight:800; background:rgba(8,26,40,.7); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.25)}
.betin .ob.on{background:#7A4CC2; color:#fff; border-color:#fff}
.seat .stk{font-size:.7rem; color:#BFE0F5; margin-top:2px; min-height:1em}
.seat .disc .card{margin:0 -3px}
.table .bet{position:absolute; transform:translate(-50%,-50%); z-index:2; display:flex; align-items:center; gap:4px; background:rgba(8,26,40,.72); color:#fff; font-weight:700; font-size:.78rem; padding:3px 8px 3px 4px; border-radius:999px; white-space:nowrap; pointer-events:none}
.table .bet i{width:14px; height:14px; border-radius:50%; background:#E8C547; border:3px dashed #fff; box-sizing:border-box; flex:none}
.table .bet.opt{background:#7A4CC2}
.table .bet.off{display:none}
.table .pot{position:absolute; left:50%; top:35%; transform:translate(-50%,-50%); background:rgba(8,26,40,.72); color:#fff; font-weight:700; font-size:.9rem; padding:4px 12px; border-radius:999px; white-space:nowrap; pointer-events:none}
.dealer{position:absolute; width:26px; height:26px; border-radius:50%; background:#fff; color:#1B4B6B; font-weight:800; display:grid; place-items:center; font-size:.85rem; transform:translate(-50%,-50%); z-index:2; box-shadow:0 2px 4px rgba(0,0,0,.4)}

/* sélecteur de cartes */
.pgrid{display:grid; grid-template-columns:repeat(13,1fr); gap:4px}
.pgrid button{border:0; padding:0; background:none; line-height:0}
.pgrid .card{width:100%; height:auto; aspect-ratio:.72; border-radius:5px}
.pgrid .card b,.pgrid .card i{font-size:.78rem}
.pgrid button:disabled{opacity:.18}

.timer{font-family:var(--display); font-weight:700; font-size:3.2rem; text-align:center; letter-spacing:.02em; font-variant-numeric:tabular-nums; margin:4px 0 2px}
.pill{display:inline-block; background:rgba(98,182,232,.14); color:var(--accent); border-radius:999px; padding:4px 12px; font-size:.82rem; font-weight:600}
.eqbar{height:14px; border-radius:7px; background:#0B1823; overflow:hidden; margin:6px 0 4px}
.eqbar > div{height:100%; background:linear-gradient(90deg,#4A9FD4,#74C4F0)}
.verdict{border-radius:14px; padding:14px; font-weight:600; margin-top:12px}
.verdict.ok{background:rgba(62,211,160,.14); border:1px solid var(--gain)}
.verdict.ko{background:rgba(240,113,106,.14); border:1px solid var(--loss)}
.dur{position:relative; margin-bottom:8px; border-radius:10px; overflow:hidden; background:#0B1823}
.dur > div.fill{position:absolute; inset:0 auto 0 0; opacity:.85}
.dur > div.txt{position:relative; display:flex; justify-content:space-between; padding:11px 14px; font-weight:600}
/* saisie rapide */
.chips{display:flex; gap:8px; overflow-x:auto; margin:8px -2px 0; padding:2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap; overflow:visible}
.chip{flex:none; border:1.5px solid var(--line); background:var(--panel2); border-radius:999px; padding:9px 15px; min-height:42px; font-weight:600; font-size:.92rem; color:var(--ink)}
.chip.on{border-color:var(--accent); color:var(--accent); background:rgba(98,182,232,.14)}
.chip:active{background:rgba(98,182,232,.2)}
.seg{display:flex; gap:3px; padding:3px; background:var(--panel2); border:1.5px solid var(--line); border-radius:12px}
.seg button{flex:1; border:0; background:none; border-radius:9px; padding:11px 2px; font-weight:600; font-size:.9rem; color:var(--dim)}
.seg button.on{background:var(--accent); color:#06121B}
.in.big{font-family:var(--display); font-weight:600; font-size:1.25rem}
details.more{border:1px solid var(--line); border-radius:14px; padding:0 14px; background:rgba(255,255,255,.015)}
details.more > summary{list-style:none; display:flex; justify-content:space-between; gap:10px; padding:14px 0; font-weight:600; cursor:pointer}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary .dim{font-weight:500; text-align:right}
input[type=date].in, input[type=time].in{box-sizing:border-box; display:block; width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; text-align:left}
.stack > *, .grid2 > *{min-width:0}
input[type=date].in::-webkit-datetime-edit, input[type=time].in::-webkit-datetime-edit{min-width:0; overflow:hidden}
input[type=date].in, input[type=time].in{overflow:hidden}
.recap{background:var(--panel2); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.7}
.recap .rd{color:var(--gold); font-family:var(--display); font-weight:700; font-size:1.15rem; margin-top:2px}
.sheet-foot{position:sticky; bottom:calc(-20px - env(safe-area-inset-bottom,0px)); margin:0 -16px calc(-20px - env(safe-area-inset-bottom,0px)); padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px); background:#0D1D2C; border-top:1px solid var(--line); z-index:2}
.livebar{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left; background:rgba(62,211,160,.1); border:1px solid var(--gain); border-radius:16px; padding:14px 16px; margin-bottom:14px; color:var(--ink)}
.livebar .dot{width:10px; height:10px; border-radius:50%; background:var(--gain); flex:none; animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.livebar .dot{animation:none}}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* fond sombre partout, même tout en bas de l'écran (pas de bande blanche) */
html,body{background-color:#09151F!important; overscroll-behavior:none}
.welcome{max-width:460px; margin:6vh auto 0; text-align:center}
.welcome .mark{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;background:linear-gradient(145deg,#F0D58A,#C99A3A);display:grid;place-items:center;color:#1A1203;font-size:2.4rem;font-weight:700}
.welcome h1{font-family:var(--display); font-size:1.6rem; margin:0 0 6px}
.welcome ul{text-align:left; color:var(--dim); line-height:1.7; padding-left:20px; margin:14px 0 18px}
</style>
</head>
<body>

<script>
/* ============================================================
   Poker Win — suivi de bankroll, session live, mains, calculateur
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const KEY = 'pokerwin_v1';
const IN_CLAUDE = /claude\.ai|claudeusercontent/.test(location.hostname);

/* ---------- icônes ---------- */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  bank:'<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2a2.6 2 0 0 0-2.6-1.4c-1.5 0-2.6.8-2.6 2s1 1.6 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2a2.7 2 0 0 1-2.7-1.4M12 6v2M12 16v2"/>',
  pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  cards:'<rect x="4" y="5" width="10" height="14" rx="2"/><path d="M16 7.5l3.5 1.2-3.2 9.6-1.3-.4"/>',
  calc:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  notes:'<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  filter:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;

/* ---------- état ---------- */
function defaultState(){
  return { v:1, updatedAt:0, name:'', sessions:[], hands:[], notes:[],
    places:[], games:[], live:null, deleted:[], tournois:[] };
}
function seedState(){
  const s = defaultState();
  s.places = [{id:'seed-place', name:'Charron', kind:'Casino'}];
  s.games = ['2/4 PL Omaha'];
  s.sessions = [{ id:'seed-session', type:'cash', date:'2026-09-17', start:'22:31', end:'22:40', minutes:9,
    place:'Charron', game:'2/4 PL Omaha', players:'Full-Ring', buyin:1000, rebuys:1, rebuyAmt:300, cashout:800, hands:0, notes:'' }];
  return s;
}
let S = defaultState();
let ui = {
  page:'home', bankTab:'general', handTab:'add', metric:'profit',
  filter:{type:'all', period:'all', place:'all'},
  draft:null, calc:null, seatEdit:null, editing:null
};

/* ---------- sauvegarde (cloud privé + copie locale) ---------- */
let dbDoc = null, saveTimer = null;
function persist(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(dbDoc){ try{ await dbDoc.set({state:S}); ui.lastSaved = Date.now(); showSaved(); }catch(e){} }
    dailyBackup(); drvSchedule();
  }, 700);
}
function showSaved(){ const el = $('#saveInfo'); if(el) el.textContent = saveInfoText(); }
function saveInfoText(){ return ui.lastSaved ? 'Dernière sauvegarde : aujourd\'hui à ' + new Date(ui.lastSaved).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : 'Sauvegarde dès que tu changes quelque chose.'; }
/* ---------- sauvegarde automatique du jour (une copie par jour, 30 jours gardés) ---------- */
let backupCol = null;
async function dailyBackup(){
  if(!backupCol) return;
  const day = todayStr();
  if(ui.backupDay === day) return;
  try{
    const ref = backupCol.doc(day), snap = await ref.get();
    if(!(snap && snap.exists)){
      await ref.set({ day, savedAt:Date.now(), sessions:(S.sessions||[]).length, state:JSON.parse(JSON.stringify(S)) });
      const all = await backupCol.get();
      const old = all.docs.map(d=>d.id).sort().reverse().slice(30);
      for(const id of old){ try{ await backupCol.doc(id).delete(); }catch(e){} }
    }
    ui.backupDay = day;
  }catch(e){}
}
async function backupsHTML(){
  const el = $('#bkList'); if(!el) return;
  if(!backupCol){ el.innerHTML = '<div class="dim">Disponible quand la sauvegarde sur ton compte est active.</div>'; return; }
  try{
    const all = await backupCol.get();
    const list = all.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(b.day||'').localeCompare(a.day||''));
    ui.backups = list;
    el.innerHTML = list.length ? list.map((b,i)=>`<div class="item"><div><div class="a">${esc(new Date(b.day+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</div><div class="b">${b.sessions} session${b.sessions>1?'s':''} · copie de ${new Date(b.savedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div></div><button class="btn sm" onclick="askRestore(${i})">Restaurer</button></div>`).join('')
      : '<div class="dim">La première copie sera faite aujourd\'hui.</div>';
  }catch(e){ el.innerHTML = '<div class="dim">Impossible de lire les sauvegardes pour l\'instant.</div>'; }
}
function askRestore(i){
  const b = (ui.backups||[])[i]; if(!b) return;
  const d = new Date(b.day+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  askConfirm('Remettre tes données comme le '+d+' ? Ce que tu as ajouté depuis sera remplacé.', 'Oui, restaurer', () => {
    S = Object.assign(defaultState(), JSON.parse(JSON.stringify(b.state)), {updatedAt:Date.now()});
    persist(); render(); toast('Sauvegarde du '+d+' restaurée');
  });
}
function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
  return null;
}
function waitForBridge(ms){
  if(!/claude\.ai|claudeusercontent/.test(location.hostname)) ms = 0;
  return new Promise(res => {
    const t0 = Date.now();
    (function chk(){
      if(window.claude && window.claude.use){ res(true); return; }
      if(Date.now()-t0 > ms){ res(false); return; }
      setTimeout(chk, 200);
    })();
  });
}
let cloudOK = false;
function sessSig(x){ return 'sig:'+[x.date,x.start,x.end,x.place,x.game,x.buyin,x.cashout].join('|'); }
function mergeStates(a, b){
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b, older = newer===a ? b : a;
  const out = Object.assign(defaultState(), newer);
  const del = new Set([].concat(a.deleted||[], b.deleted||[]));
  const uni = (k, keyFn) => { const m = new Map();
    [older[k]||[], newer[k]||[]].forEach(arr => arr.forEach(x => { const kk = keyFn(x); if(!del.has(x.id) && !del.has(kk)) m.set(kk, x); }));
    return Array.from(m.values()); };
  const byId = uni('sessions', x=>x.id), bySig = new Map();
  byId.forEach(x => bySig.set(sessSig(x), x));
  out.sessions = Array.from(bySig.values());
  out.hands = uni('hands', x=>x.id);
  out.tournois = uni('tournois', x=>x.id);
  out.notes = uni('notes', x=>x.id);
  out.places = uni('places', x=>'pl:'+x.name);
  out.games = Array.from(new Set([].concat(older.games||[], newer.games||[])));
  out.deleted = Array.from(del);
  out.updatedAt = Math.max(a.updatedAt||0, b.updatedAt||0, Date.now());
  return out;
}
async function initStorage(){
  const local = loadLocal();
  if(local){ S = Object.assign(defaultState(), local); }
  render();
  try{
    if(await waitForBridge(8000)){
      const db = await window.claude.use('db');
      const user = await window.claude.use('user');
      if(db && user){
        const id = await user.id();
        if(id){
          dbDoc = db.doc(`data/users/${id}/state`);
          const snap = await dbDoc.get();
          let cloud = snap && snap.exists && snap.data() && snap.data().state;
          if(cloud){ try{ cloud = JSON.parse(JSON.stringify(cloud)); }catch(e){} } /* copie modifiable des données du compte */
          if(cloud && local){ S = mergeStates(Object.assign(defaultState(), cloud), Object.assign(defaultState(), local)); }
          else if(cloud){ S = Object.assign(defaultState(), cloud); }
          else if(!local){ S = defaultState(); } /* nouvel utilisateur : appli vide, rien de Manu */
          await dbDoc.set({state:S});
          cloudOK = true; ui.lastSaved = Date.now();
          try{ backupCol = dbDoc.collection('backups'); }catch(e){ backupCol = null; }
          dailyBackup();
          try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
          render();
          return;
        }
      }
    }
  }catch(e){ cloudOK = false; }
  if(!local){ S = defaultState(); persist(); render(); }
}

/* ---------- formats ---------- */
const nf = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:0});
const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const DAYS = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
function chipAmt(v){ const n = parseFloat(String(v).replace(',','.')); return isNaN(n)? '' : n.toLocaleString('fr-FR',{maximumFractionDigits:2})+' €'; }
function numOr0(v){ const n = parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)? 0 : n; }
/* mise d'un siège : ce qu'il a mis s'il est rempli, sinon sa blind (SB/BB) */
function betOf(d, p){ const s = d.seats[p]; if(s && s.bet!=null && s.bet!=='') return numOr0(s.bet); return p==='SB'? numOr0(d.sb) : p==='BB'? numOr0(d.bb) : 0; }
/* pot calculé tout seul = somme des mises de tous les sièges */
function potOf(d){ const pos = POSLIST[d.players] || POSLIST[9]; const sum = pos.reduce((a,p)=>a+betOf(d,p),0); return sum>0? sum : numOr0(d.pot); }
function eur(n, plus){ n = Math.round(n||0); return (n<0?'−':(plus&&n>0?'+':'')) + nf.format(Math.abs(n)) + ' €'; }
function kc(n){ const a = Math.abs(n); let t;
  if(a>=10000) t = nf.format(Math.round(a/1000))+'k';
  else if(a>=1000) t = (Math.round(a/100)/10).toString().replace('.',',')+'k';
  else t = nf.format(Math.round(a));
  return (n<0?'−':'')+t; }
function cls(n){ return n>0.0001?'gain':(n<-0.0001?'loss':''); }
function pct(n){ return (Math.round((n||0)*100)).toString().replace('-','−') + ' %'; }
function fmtDate(d){ try{ return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }catch(e){ return d; } }
function hm(min){ min = Math.max(0, Math.round(min||0)); return Math.floor(min/60)+':'+String(min%60).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- calculs sur les sessions ---------- */
function enrich(s){
  const inv = (+s.buyin||0) + (+s.rebuys||0)*(+s.rebuyAmt||0);
  const profit = (+s.cashout||0) - inv;
  const ts = new Date(s.date+'T'+(s.start||'12:00')).getTime();
  /* une durée de plus de 24 h vient d'une session live oubliée : on se fie alors aux heures de début et de fin */
  let mins = +s.minutes||0; if(mins > 1440 && s.start && s.end) mins = minutesBetween(s.start, s.end);
  return Object.assign({}, s, {inv, profit, minutes:mins, hrs:mins/60, ts});
}
function allSessions(){ return S.sessions.filter(s=>s.type!=='tournoi').map(enrich).sort((a,b)=>a.ts-b.ts); }
function filteredSessions(){
  const f = ui.filter, now = new Date();
  return allSessions().filter(s => {
    if(f.type!=='all' && s.type!==f.type) return false;
    if(f.place!=='all' && s.place!==f.place) return false;
    const d = new Date(s.ts);
    if(f.period==='month' && !(d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear())) return false;
    if(f.period==='3m' && s.ts < now.getTime()-92*864e5) return false;
    if(f.period==='year' && d.getFullYear()!==now.getFullYear()) return false;
    return true;
  });
}
function agg(list){
  const n = list.length;
  const inv = list.reduce((a,s)=>a+s.inv,0), out = list.reduce((a,s)=>a+(+s.cashout||0),0);
  const profit = out-inv, hrs = list.reduce((a,s)=>a+s.hrs,0);
  const wins = list.filter(s=>s.profit>0).length;
  const rebuys = list.reduce((a,s)=>a+(+s.rebuys||0),0);
  return { n, inv, out, profit, hrs, hands:list.reduce((a,s)=>a+(+s.hands||0),0), wins,
    roi: inv? profit/inv : 0, hourly: hrs? profit/hrs : 0, won: n? wins/n : 0,
    avgBuy: n? inv/n : 0, avgProfit: n? profit/n : 0, avgRebuys: n? rebuys/n : 0,
    avgRecave: n? list.reduce((a,s)=>a+(+s.rebuys||0)*(+s.rebuyAmt||0),0)/n : 0 };
}

/* ---------- graphiques SVG ---------- */
let gid = 0;
function barChart(items, o={}){
  const W=360, H=o.h||190, pl=6, pr=6, pt=24, pb=26, n=items.length;
  const vals = items.map(i=>i.v), max = Math.max(0,...vals), min = Math.min(0,...vals), span = (max-min)||1;
  const ih = H-pt-pb, zero = pt + ih*(max/span), bw = (W-pl-pr)/n;
  let g = `<line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="#23425A" stroke-width="1"/>`;
  items.forEach((it,i) => {
    const x = pl+i*bw+bw*0.16, w = bw*0.68; let y, h;
    if(it.v>=0){ h = Math.max(it.v? 3:0, ih*it.v/span); y = zero-h; } else { h = Math.max(3, ih*(-it.v)/span); y = zero; }
    const col = it.v>=0 ? '#3ED3A0' : '#F0716A';
    if(it.v!==0) g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${col}" opacity=".9"/>`;
    if(it.v!==0){ const ty = it.v>=0 ? y-5 : y+h+12; g += `<text x="${x+w/2}" y="${ty}" font-size="${n>8?9:11}" fill="#EAF4FB" text-anchor="middle" font-weight="600">${esc((o.fmt||kc)(it.v))}</text>`; }
    g += `<text x="${pl+i*bw+bw/2}" y="${H-8}" font-size="${n>8?9.5:11}" fill="${it.v!==0?'#EAF4FB':'#8CA5B9'}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function lineChart(vals, o={}){
  const W=360, H=o.h||170, pl=10, pr=10, pt=14, pb=14;
  if(!vals.length) return '';
  const id = 'g'+(++gid);
  const max = Math.max(0,...vals), min = Math.min(0,...vals), span = (max-min)||1;
  const X = i => vals.length===1 ? W/2 : pl + (W-pl-pr)*i/(vals.length-1);
  const Y = v => pt + (H-pt-pb)*(max-v)/span;
  const last = vals[vals.length-1], col = last>=0 ? '#3ED3A0' : '#F0716A';
  const pts = vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${Y(0).toFixed(1)} L${pts.join(' L')} L${X(vals.length-1).toFixed(1)},${Y(0).toFixed(1)}Z`;
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".34"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2C4D66" stroke-dasharray="3 4"/>
    <path d="${area}" fill="url(#${id})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${vals.length<=40 ? vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${col}"/>`).join('') : ''}
  </svg>`;
}
function cumul(list){ let c=0; return [0].concat(list.map(s => (c += s.profit))); }
/* graties « propres » pour l'axe des montants (ex. −500, 0, 500, 1 000) */
function niceTicks(min, max, n){
  const span = (max-min)||1, raw = span/(n||4), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].find(m => m*mag >= raw)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, out = [];
  for(let v=lo; v<=hi+step/2; v+=step) out.push(Math.round(v*100)/100);
  return out;
}
function pctSigned(p){ const v = p*100, t = Math.abs(v)<10 ? (Math.round(v*10)/10).toString().replace('.',',') : Math.round(v).toString(); return (v>0.05?'+':'')+t.replace('-','−')+' %'; }
function amtShort(v){ return Math.abs(v)>=10000 ? (v>0?'+':'')+kc(v)+' €' : eur(v,true); }
/* points de la courbe : gain total après chaque session + pourcentage = gain total ÷ total misé (buy-ins + recaves) */
function evoPoints(list){
  let c = 0, inv = 0; const pts = [{v:0, p:null, d:null, s:0, i:0}];
  list.forEach(s => { c += s.profit; inv += s.inv; pts.push({v:c, p:inv? c/inv : 0, d:s.date, s:s.profit, i:inv}); });
  return pts;
}
function dm(d){ if(!d) return ''; const p = String(d).split('-'); return p.length===3 ? p[2]+'/'+p[1] : d; }
/* courbe détaillée : montant (€) et pourcentage écrits sur les points, axe des montants à gauche, dates en bas */
function evoChart(list, o={}){
  const pts = evoPoints(list); if(pts.length<2) return '';
  const W=360, H=o.h||230, pl=46, pr=22, pt=30, pb=38, n = pts.length;
  const vals = pts.map(x=>x.v), ticks = niceTicks(Math.min(0,...vals), Math.max(0,...vals), 4);
  const lo = ticks[0], hi = ticks[ticks.length-1], span = (hi-lo)||1;
  const X = i => pl + (W-pl-pr)*i/(n-1), Y = v => pt + (H-pt-pb)*(hi-v)/span;
  const last = vals[n-1], col = last>=0 ? '#3ED3A0' : '#F0716A', id = 'e'+(++gid);
  const halo = 'paint-order="stroke" stroke="#0F2030" stroke-width="3.5" stroke-linejoin="round"';
  let g = '';
  ticks.forEach(t => { const y = Y(t).toFixed(1);
    g += `<line x1="${pl}" x2="${W-pr+6}" y1="${y}" y2="${y}" stroke="${t===0?'#3A6280':'#1E3A50'}" ${t===0?'stroke-dasharray="3 4"':''} stroke-width="1"/>`;
    g += `<text x="${pl-6}" y="${(+y+3.5).toFixed(1)}" font-size="10" fill="#8CA5B9" text-anchor="end">${esc(kc(t))} €</text>`; });
  const line = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`);
  g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".30"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  g += `<path d="M${X(0).toFixed(1)},${Y(0).toFixed(1)} L${line.join(' L')} L${X(n-1).toFixed(1)},${Y(0).toFixed(1)}Z" fill="url(#${id})"/>`;
  g += `<polyline points="${line.join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* on écrit les valeurs sur assez de points pour que les étiquettes ne se chevauchent pas (toujours le dernier) */
  const step = Math.max(1, Math.ceil((n-1)*54/(W-pl-pr)));
  const show = new Set(); for(let i=0;i<n;i+=step) show.add(i);
  if(!show.has(n-1)){ const prev = Math.floor((n-1)/step)*step; if(n-1-prev < step*0.7 && prev!==0) show.delete(prev); show.add(n-1); }
  pts.forEach((p,i) => {
    const x = X(i), y = Y(p.v), c = p.v>0.0001?'#3ED3A0':(p.v<-0.0001?'#F0716A':'#EAF4FB');
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${show.has(i)?3.6:2.4}" fill="${col}" stroke="#0F2030" stroke-width="1.2"/>`;
    if(!show.has(i)) return;
    const anchor = i===0? 'start' : (i===n-1? 'end' : 'middle'), ax = i===0? x-4 : (i===n-1? x+6 : x);
    if(i===0){ g += `<text x="${ax.toFixed(1)}" y="${(y-9).toFixed(1)}" font-size="10" fill="#8CA5B9" text-anchor="${anchor}" ${halo}>Départ 0 €</text>`; }
    else {
      g += `<text x="${ax.toFixed(1)}" y="${(y-9).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" text-anchor="${anchor}" ${halo}>${esc(amtShort(p.v))}</text>`;
      g += `<text x="${ax.toFixed(1)}" y="${(y+17).toFixed(1)}" font-size="10" font-weight="600" fill="${c}" text-anchor="${anchor}" ${halo}>${esc(pctSigned(p.p))}</text>`;
    }

  });

function groupVal(list){
  if(ui.metric==='hourly'){ const a=agg(list); return Math.round(a.hourly); }
  return Math.round(agg(list).profit);
}
function bkGraph(list){
  const seg = (`<div class="row" style="margin-bottom:14px"><button class="btn sm ${ui.metric==='profit'?'solid':''}" onclick="ui.metric='profit';render()">Profit</button><button class="btn sm ${ui.metric==='hourly'?'solid':''}" onclick="ui.metric='hourly';render()">Par heure</button></div>`);
  const wd = DAYS.map((l,i) => ({l, v:groupVal(list.filter(s=>((new Date(s.ts).getDay()+6)%7)===i))}));
  const mo = MONTHS.map((l,i) => ({l, v:groupVal(list.filter(s=>new Date(s.ts).getMonth()===i))}));
  const years = [...new Set(list.map(s=>new Date(s.ts).getFullYear()))].sort();
  const yr = years.map(y => ({l:String(y), v:groupVal(list.filter(s=>new Date(s.ts).getFullYear()===y))}));
  const buckets = [['0–1 h',0,1],['1–2 h',1,2],['2–4 h',2,4],['4–6 h',4,6],['6 h et +',6,99]].map(b => ({l:b[0], list:list.filter(s=>s.hrs>=b[1]&&s.hrs<b[2])})).filter(b=>b.list.length);
  const mx = Math.max(1,...buckets.map(b=>Math.abs(groupVal(b.list))));
  return seg + `
  <div class="box"><h3 class="center">Évolution du résultat</h3><div style="margin:0 -6px">${evoChart(list,{h:240})}</div>${evoDetail(list)}</div>
  <div class="box"><h3 class="center">Jours de la semaine</h3>${barChart(wd)}</div>
  <div class="box"><h3 class="center">Mois</h3>${barChart(mo)}</div>
  <div class="box"><h3 class="center">Années</h3>${barChart(yr)}</div>
  <div class="box"><h3 class="center">Durée de la session</h3>${buckets.map(b=>{const v=groupVal(b.list); return `<div class="dur"><div class="fill" style="width:${Math.max(8,Math.abs(v)/mx*100)}%;background:${v>=0?'#2B8F72':'#B4524C'}"></div><div class="txt"><span>${b.l} · ${b.list.length} session${b.list.length>1?'s':''}</span><span>${eur(v)}</span></div></div>`;}).join('')}</div>`;
}
function bkTend(list){
  if(list.length<5) return `<div class="box empty"><b>Pas encore assez de sessions</b>Il faut au moins 5 sessions pour afficher ta tendance (tu en as ${list.length}).</div>`;
  const res = list.map(s=>s.profit);
  const ma = res.map((_,i) => { const sl = res.slice(Math.max(0,i-4), i+1); return sl.reduce((a,b)=>a+b,0)/sl.length; });
  const best = Math.max(...res), worst = Math.min(...res);
  let streak = 0, sign = 0; for(let i=res.length-1;i>=0;i--){ const sg = res[i]>0?1:(res[i]<0?-1:0); if(i===res.length-1){ sign=sg; streak=1; } else if(sg===sign && sg!==0) streak++; else break; }
  const last10 = agg(list.slice(-10)), prev = list.slice(-20,-10).length? agg(list.slice(-20,-10)) : null;
  return `<div class="box"><h3 class="center">Moyenne des 5 dernières sessions</h3><div style="margin:0 -16px">${lineChart(ma.map(Math.round),{h:150})}</div></div>
   <div class="box"><div class="grid2">
     <div class="stat"><div class="v gain">${eur(best)}</div><div class="l">Meilleure session</div></div>
     <div class="stat"><div class="v loss">${eur(worst)}</div><div class="l">Pire session</div></div>
     <div class="stat"><div class="v ${sign>0?'gain':sign<0?'loss':''}">${streak} ${sign>0?'gagnée':sign<0?'perdue':'neutre'}${streak>1?'s':''}</div><div class="l">Série en cours</div></div>
     <div class="stat"><div class="v ${cls(last10.profit)}">${eur(last10.profit)}</div><div class="l">10 dernières sessions${prev? ` (avant : ${eur(prev.profit)})`:''}</div></div>
   </div></div>`;
}
function bkVar(list){
  if(list.length<5) return `<div class="box empty"><b>Pas encore assez de sessions</b>Il faut au moins 5 sessions pour calculer ta variance (tu en as ${list.length}).</div>`;
  const res = list.map(s=>s.profit), n = res.length, mean = res.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(res.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
  const se = sd/Math.sqrt(n), lo = mean-1.96*se, hi = mean+1.96*se;
  let peak = 0, c = 0, dd = 0, lose = 0, maxLose = 0;
  res.forEach(r => { c += r; peak = Math.max(peak,c); dd = Math.max(dd, peak-c); lose = r<0? lose+1 : 0; maxLose = Math.max(maxLose, lose); });
  return `<div class="box"><h3 class="center">Variance de ton jeu</h3><div class="grid2">
     <div class="stat"><div class="v ${cls(mean)}">${eur(mean)}</div><div class="l">Résultat moyen par session</div></div>
     <div class="stat"><div class="v">${eur(sd)}</div><div class="l">Écart-type (les hauts et bas)</div></div>
     <div class="stat"><div class="v">${eur(lo)} à ${eur(hi)}</div><div class="l">Ton vrai résultat moyen, à 95 %</div></div>
     <div class="stat"><div class="v loss">${eur(-dd)}</div><div class="l">Plus grosse chute (downswing)</div></div>
     <div class="stat"><div class="v">${maxLose}</div><div class="l">Plus longue série perdante</div></div>
     <div class="stat"><div class="v">${n}</div><div class="l">Sessions analysées</div></div>
   </div><p class="dim" style="font-size:.88rem;margin:14px 0 0">Plus tu enregistres de sessions, plus l'intervalle à 95 % se resserre et plus ton vrai niveau se dessine.</p></div>`;
}

function recentUnique(vals, n){ const out = []; vals.forEach(v => { v = (v==null?'':String(v)).trim(); if(v && !out.includes(v)) out.push(v); }); return out.slice(0, n||5); }

function buyinChoices(){

function durText(m){ m = Math.max(0, Math.round(m||0)); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function updateDur(){
  const el = $('#eRecap'); if(!el) return;

  const d = $('#eDate').value, day = d ? new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : '';
  el.innerHTML = m>=0 ? `<div><span class="dim">Commencée</span> ${esc(day)} à <b>${esc(a)}</b></div><div><span class="dim">Terminée</span> à <b>${esc(b)}</b>${toMin(b)<toMin(a)?' (le lendemain)':''}</div><div class="rd">⏱ ${durText(m - pauseOf(a,b))} jouées</div>${pauseOf(a,b)? `<div class="dim" style="font-size:.88rem">Pause de ${durText(pauseOf(a,b))} déduite</div>`:''}`
    : `<div class="dim">${a||b ? 'Indique aussi l\'heure de '+(a?'fin':'début')+'.' : 'Pas encore d\'heures : touche une durée plus haut ou choisis le début et la fin.'}</div>`;
  document.querySelectorAll('#eDurChips .chip').forEach(c => c.classList.toggle('on', +c.dataset.m===m));
  updateDetSum();
}
function pauseOf(a,b){ const o = ui.editOrig; return (o && o.pauseMin && a===o.start && b===o.end) ? o.pauseMin : 0; }
function updateDetSum(){
  const el = $('#eDetSum'); if(!el) return;
  const d = $('#eDate').value, a = $('#eStart').value, b = $('#eEnd').value;
  const day = !d ? 'Sans date' : d===todayStr() ? "Aujourd'hui" : new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  el.textContent = day + (a && b ? ' · '+a+' → '+b : '');
}
function hhmm(min){ min = ((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
/* Un geste : la fin = maintenant (arrondi à 5 min), le début = fin − durée */
function setDur(m){
  const st = $('#eStart'), en = $('#eEnd');
  if(st.value && !en.value){ en.value = hhmm(toMin(st.value)+m); }
  else {
    if(!en.value){ const n = new Date(); en.value = hhmm(Math.floor((n.getHours()*60+n.getMinutes())/5)*5); }
    st.value = hhmm(toMin(en.value)-m);
    if(!ui.dateTouched && !ui.editing && toMin(st.value) > toMin(en.value)){
      const y = new Date(Date.now()-864e5); $('#eDate').value = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    }
  }
  updateDur();
}
function updateGain(){
  const el = $('#eGain'); if(!el) return;
  syncChips('eBuy');
  const b = parseFloat($('#eBuy').value), o = parseFloat($('#eOut').value), r = parseFloat($('#eRebAmt').value)||0;
  const rc = $('#eRebChips');
  if(rc){ const amts = recentUnique([b>0? b:'', b>0? Math.round(b/2):'', 100]).map(Number).filter(x=>x>0).slice(0,3);
    rc.innerHTML = amts.map(a=>`<button type="button" class="chip" data-add="${a}" onclick="addChip(this,'eRebAmt')">+ ${eur(a)}</button>`).join('') + (r? `<button type="button" class="chip" onclick="$('#eRebAmt').value='';updateGain()">Pas de recave</button>` : ''); }
  if(isNaN(b) || isNaN(o)){ el.textContent = '—'; el.className = ''; return; }
  const g = o - b - r; el.textContent = eur(g, true); el.className = cls(g);
}
function minutesBetween(a, b){ if(!a||!b) return 0; const [h1,m1]=a.split(':').map(Number), [h2,m2]=b.split(':').map(Number); let d=(h2*60+m2)-(h1*60+m1); if(d<0) d+=1440; return d; }
function saveSession(sure){
  const g = id => $('#'+id).value;
  const buyin = parseFloat(g('eBuy')), cashout = parseFloat(g('eOut'));
  if(!g('eDate')){ $('#eDet').open = true; $('#eErr').textContent='Choisis une date.'; return; }
  if(isNaN(buyin)){ $('#eErr').textContent='Indique ton buy-in.'; return; }
  if(isNaN(cashout)){ $('#eErr').textContent='Indique ton cash-out (0 si tu as tout perdu).'; $('#eOut').focus(); return; }
  const pz = pauseOf(g('eStart'),g('eEnd'));
  /* modification d'une session : on demande une confirmation, dans la fenêtre elle-même pour ne rien perdre */
  if(ui.editing && !sure){
    window._footBack = $('#eFoot').innerHTML;
    $('#eFoot').outerHTML = `<div id="eFoot"><div style="font-weight:600;margin-bottom:10px;text-align:center">Enregistrer les modifications ?</div><div class="row"><button class="btn" onclick="$('#eFoot').innerHTML='';$('#eFoot').className='row';$('#eFoot').innerHTML=window._footBack">Non, revenir</button><button class="btn solid" onclick="saveSession(true)">Oui, enregistrer</button></div></div>`;
    return;
  }
  const o = { type:'cash', date:g('eDate'), start:g('eStart'), end:g('eEnd'), minutes:Math.max(0, minutesBetween(g('eStart'),g('eEnd')) - pz), pauseMin:pz,
    place:g('ePlace').trim(), game:g('eGame').trim(), players:g('ePl'), buyin, cashout,
    rebuys:(parseFloat(g('eRebAmt'))||0)>0?1:0, rebuyAmt:parseFloat(g('eRebAmt'))||0, hands:0, notes:'' };
  if(o.place && !S.places.find(p=>p.name===o.place)) S.places.push({id:uid(), name:o.place, kind:'Casino'});
  if(o.game && !S.games.includes(o.game)) S.games.push(o.game);
  S.deleted = (S.deleted||[]).filter(x => x !== sessSig(o));
  if(ui.editing){ const i = S.sessions.findIndex(x=>x.id===ui.editing); S.sessions[i] = Object.assign({}, S.sessions[i], o, {id:ui.editing}); }
  else S.sessions.push(Object.assign({id:uid()}, o));
  persist(); closeSheet(); render(); toast('Session enregistrée');
}
function delSession(id){ askDelete('cette session',()=>{ const d = S.sessions.find(x=>x.id===id); S.deleted = (S.deleted||[]).concat([id].concat(d? [sessSig(d)] : [])); S.sessions = S.sessions.filter(x=>x.id!==id); persist(); render(); toast('Session supprimée'); }, ()=>editSession(id)); }

function tEnrich(t){
  const inv = (+t.buyin||0)*(1+(+t.rebuys||0)) + (+t.addon||0);
  return Object.assign({}, t, { inv, profit:(+t.gain||0)-inv, hrs:(t.minutes||0)/60, ts:new Date(t.date+'T'+(t.start||'12:00')).getTime() });
}
function allTournois(){ return (S.tournois||[]).map(tEnrich).sort((a,b)=>a.ts-b.ts); }
function rankTxt(r){ r = +r; if(!r) return '—'; return r===1 ? '1er' : r+'e'; }

function liveSum(){
  const el = $('#lSum'); if(!el) return;
  const b = parseFloat($('#lBuy').value);
  el.textContent = [$('#lPlace').value.trim(), $('#lGame').value.trim(), $('#lPl').value, b>0? eur(b) : ''].filter(Boolean).join(' · ') || 'Choisis ton buy-in';
}
/* temps joué = maintenant (ou début de la pause) − début − pauses déjà faites */
function livePlayedMs(L){ return Math.max(0, (L.pausedAt || Date.now()) - L.startTs - (+L.pausedMs||0)); }
function askPause(btn){
  const p = S.live && S.live.pausedAt;
  inlineAsk(btn, p ? 'Relancer le chrono ?' : 'Mettre la session en pause ?', p ? 'Oui, relancer' : 'Oui, pause', togglePause);
}
function togglePause(){
  const L = S.live; if(!L) return;
  if(L.pausedAt){ S.live = Object.assign({}, L, { pausedMs:(+L.pausedMs||0) + (Date.now()-L.pausedAt), pausedAt:null }); toast('Chrono relancé'); }
  else { S.live = Object.assign({}, L, { pausedAt:Date.now() }); toast('Session en pause'); }
  persist(); render();
}
function tickLive(){
  const el = $('#liveTimer'); if(!el || !S.live) return;
  const sec = Math.floor(livePlayedMs(S.live)/1000);
  el.textContent = Math.floor(sec/3600)+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
function startLive(){
  ui.lastEnded = null;
  const buy = parseFloat($('#lBuy').value);
  if(isNaN(buy) || buy<=0){ $('#lErr').textContent = 'Indique ton buy-in.'; return; }
  S.live = { type:'cash', players:$('#lPl').value, place:$('#lPlace').value.trim(), game:$('#lGame').value.trim(), buyin:buy, rebuys:0, rebuyAmt:0, recaveList:[], startTs:Date.now() };
  persist(); render();
}
function liveRebuy(amt){
  const a = amt!=null ? +amt : parseFloat($('#lReb').value);
  if(isNaN(a) || a<=0){ toast('Indique le montant de la recave'); return; }
  const cur = liveRec(S.live);
  const list = (S.live.recaveList || (cur? [cur] : [])).concat([a]);
  S.live = Object.assign({}, S.live, { recaveList:list, recave:cur + a, rebuys:1, rebuyAmt:cur + a }); persist(); render(); toast('Recave de '+eur(a)+' ajoutée');
}
function undoRebuy(){
  const L = S.live; if(!L || !(L.recaveList||[]).length) return;
  const list = L.recaveList.slice(), a = list.pop(), rec = Math.max(0, liveRec(L) - a);
  S.live = Object.assign({}, L, { recaveList:list, recave:rec, rebuys:rec? 1 : 0, rebuyAmt:rec }); persist(); render(); toast('Recave annulée');
}
function askEndLive(){
  openSheet(`<h2>Terminer la session ?</h2><p style="margin:0 0 18px;color:var(--dim)">Le chrono va s'arrêter. Tu indiqueras ensuite ton cash-out pour enregistrer la session.</p>
    <div class="row"><button class="btn" onclick="closeSheet()">Non, continuer</button><button class="btn solid" onclick="endLive()">Oui, terminer</button></div>`);
}
function endLive(){
  const L = S.live, inv = (+L.buyin||0) + liveRec(L);
  openSheet(`<h2>Terminer la session</h2><div class="stack"><div><label class="f">Cash-out (€)</label><input class="in big" type="number" inputmode="decimal" id="lOut" placeholder="Ce que tu repars avec" oninput="syncChips('lOut');liveGain()">
      <div class="chips" data-for="lOut"><button type="button" class="chip" data-v="0" onclick="setChip(this,'lOut')">0 € (tout perdu)</button><button type="button" class="chip" data-v="${inv}" onclick="setChip(this,'lOut')">${eur(inv)} (à l'équilibre)</button></div></div>
    <div class="box" style="margin:0;text-align:center;padding:14px"><div class="dim" style="font-size:.85rem">Gain de la session</div><div id="lGain" style="font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.2">—</div></div><div id="lErr2" class="err"></div>
    <div class="row"><button class="btn" onclick="closeSheet()">Retour</button><button class="btn solid" onclick="confirmEndLive()">Enregistrer</button></div></div>`);
  setTimeout(()=>{ const i = $('#lOut'); if(i) i.focus(); }, 250);
}
function liveGain(){
  const el = $('#lGain'), L = S.live; if(!el || !L) return;
  const o = parseFloat($('#lOut').value); if(isNaN(o)){ el.textContent = '—'; el.className = ''; return; }
  const g = o - (+L.buyin||0) - liveRec(L); el.textContent = eur(g, true); el.className = cls(g);
}
function confirmEndLive(){
  const out = parseFloat($('#lOut').value);
  if(isNaN(out) || out<0){ $('#lErr2').textContent = 'Indique ton cash-out (0 si tu as tout perdu).'; return; }
  const L = S.live, st = new Date(L.startTs), en = new Date();
  const p2 = n => String(n).padStart(2,'0');
  S.sessions.push({ id:uid(), type:L.type, date:st.getFullYear()+'-'+p2(st.getMonth()+1)+'-'+p2(st.getDate()),
    start:p2(st.getHours())+':'+p2(st.getMinutes()), end:p2(en.getHours())+':'+p2(en.getMinutes()),
    minutes:Math.max(1,Math.round(livePlayedMs(Object.assign({}, L, {pausedAt:L.pausedAt||null}))/60000)), pauseMin:Math.round(((+L.pausedMs||0) + (L.pausedAt? en-L.pausedAt : 0))/60000), place:L.place, game:L.game, players:L.players,
    buyin:L.buyin, rebuys:(L.rebuys?1:0), rebuyAmt:liveRec(L), cashout:out, hands:0, notes:'' });
  if(L.place && !S.places.find(p=>p.name===L.place)) S.places.push({id:uid(), name:L.place, kind:'Casino'});
  if(L.game && !S.games.includes(L.game)) S.games.push(L.game);
  ui.lastEnded = enrich(S.sessions[S.sessions.length-1]);
  S.live = null; persist(); closeSheet(); render(); window.scrollTo(0,0); toast('Session enregistrée');
}

const RANKS = '23456789TJQKA', SUITS = ['♠','♥','♦','♣'];
function cardFace(id, c=''){ const r = RANKS[id>>2], su = SUITS[id&3], red = (id&3)===1||(id&3)===2;
  return `<span class="card ${red?'red':''} ${c}"><b>${r==='T'?'10':r}</b><i>${su}</i></span>`; }
function cardBack(c=''){ return `<span class="card back ${c}"></span>`; }
function cardOr(id, c=''){ return (id==null) ? cardBack(c) : cardFace(id, c); }
let pickCb = null;
function pickCard(used, current, cb){
  pickCb = cb;
  let g = '';
  for(let s=0;s<4;s++) for(let r=12;r>=0;r--){ const id = r*4+s; g += `<button ${used.includes(id)&&id!==current?'disabled':''} onclick="pickDone(${id})" aria-label="${RANKS[r]}${SUITS[s]}">${cardFace(id)}</button>`; }
  $('#picker').innerHTML = `<button type="button" class="sheet-x" onclick="closePicker()" aria-label="Fermer">✕</button><h2>Choisis une carte</h2><div class="pgrid">${g}</div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="closePicker()">Fermer</button>${current!=null?'<button class="btn danger" onclick="pickDone(null)">Retirer la carte</button>':''}</div>`;
  $('#picker').classList.add('open'); $('#pickerVeil').classList.add('open');
}
function closePicker(){ $('#picker').classList.remove('open'); $('#pickerVeil').classList.remove('open'); }
function pickDone(id){ closePicker(); if(pickCb) pickCb(id); }

const POSLIST = {
  9:['UTG1','UTG2','MP','LJ','HJ','CO','BU','SB','BB'], 8:['UTG1','UTG2','MP','HJ','CO','BU','SB','BB'], 7:['UTG1','MP','HJ','CO','BU','SB','BB'],
  6:['UTG','HJ','CO','BU','SB','BB'], 5:['UTG','CO','BU','SB','BB'], 4:['CO','BU','SB','BB'], 3:['BU','SB','BB'], 2:['SB','BB']
};
function newDraft(){ return { type:'cash', players:8, game:'Omaha', limit:'Pot Limit', sb:'', bb:'', comment:'', seats:{}, board:[null,null,null,null,null] }; }
function needCards(game){ return game==='Omaha'? 4 : 2; }
function seatOf(d, pos){ if(!d.seats[pos]) d.seats[pos] = {cards:[], stack:'', hero:false}; return d.seats[pos]; }
function usedCardsHand(d){ const u = []; d.board.forEach(c=>{ if(c!=null) u.push(c); }); Object.values(d.seats).forEach(s => s.cards.forEach(c=>{ if(c!=null) u.push(c); })); return u; }
function tableHTML(d, ro){
  const pos = POSLIST[d.players] || POSLIST[9], n = pos.length, bu = pos.indexOf('BU'), angBU = 108, nc = needCards(d.game);
  let seats = '', dealer = '';
  /* ro : true = table figée ; 'id' = main enregistrée modifiable sur place ; false = main en cours */
  const hid = typeof ro==='string'? ro : null, H = hid? `'${hid}'` : 'null', editable = ro!==true;
  pos.forEach((p,i) => {
    const a = (angBU + (i-bu)*360/n) * Math.PI/180;
    const x = 50 + 41*Math.cos(a), y = 50 + 41*Math.sin(a)*1.0;
    const s = d.seats[p] || {cards:[], stack:'', hero:false};
    const cs = Array.from({length:nc}, (_,k)=> { const c = cardOr(s.cards[k]==null? null : s.cards[k], nc>2?'sm':'');
      return editable? c.replace('<span class="card', `<span onclick="event.stopPropagation();pickSeatCard('${p}',${k},${H})" class="card`) : c; });
    /* mise affichée juste au-dessus du joueur (en dessous pour les sièges tout en haut) */
    const blind = betOf(d,p), opt = !!(s && s.option);
    let betIn = '';
    if(editable){ const own = s.bet!=null && s.bet!=='';
      betIn = `<div class="betin" style="left:${Math.min(88,Math.max(12,x))}%;top:${y}%"><input type="number" inputmode="decimal" class="${own||blind>0?'has':''}" value="${own? esc(s.bet):''}" placeholder="${blind>0? esc(String(blind))+' €' : 'Mise'}" aria-label="Mise de ${p}" onchange="setBet('${p}',this.value,${H})"><button type="button" class="ob ${opt?'on':''}" onclick="toggleOptionAt('${p}',${H})" aria-label="Option ${p}">OPT</button></div>`;
      const hasStk = s.stack!=='' && s.stack!=null;
      betIn += `<div class="stkin" style="left:${x}%;top:${y}%"><input type="number" inputmode="decimal" class="${hasStk?'has':''}" value="${hasStk? esc(s.stack):''}" placeholder="Tapis" aria-label="Tapis de ${p}" onchange="setStack('${p}',this.value,${H})"></div>`; }
    /* jeton posé sur le tapis, entre le joueur et le centre (mise et/ou option) */
    { const sn = Math.sin(a), bx = 50 + 25*Math.cos(a); let by = 50 + (sn<0? 24 : 15)*sn; if(by>37 && by<56) by = by<47? 37 : 57;
      seats += `<div class="bet ${opt?'opt':''} ${blind>0||opt?'':'off'}" data-bet="${p}" style="left:${bx}%;top:${by}%"><i></i>${feltTxt(blind,opt)}</div>`; }
    const chip = false && !editable && (blind>0 || opt)? `<span class="sbet ${y<22?'below':''} ${opt?'opt':''}"><i></i>${opt?'Option ':''}${blind>0? chipAmt(blind):''}</span>` : '';
    seats += `<button class="seat ${s.hero?'hero':''}" style="left:${x}%;top:${y}%" ${ro===true?'disabled':typeof ro==='string'?`onclick="editSavedHand('${ro}','${p}')"`:`onclick="editSeat('${p}')"`} aria-label="Siège ${p}">${chip}<div class="disc">${cs.join('')}<span class="pos">${p}</span></div><div class="stk">${!editable && s.stack!==''&&s.stack!=null? 'Tapis '+chipAmt(s.stack):''}</div></button>${betIn}`;
    if(p==='BU'){ const ax = 50 + 30*Math.cos(a-0.5), ay = 50 + 30*Math.sin(a-0.5); dealer = `<div class="dealer" style="left:${ax}%;top:${ay}%">B</div>`; }
  });
  const board = d.board.map((c,i)=> !editable? cardOr(c,'') : `<button class="slot" onclick="editBoard(${i},${H})" aria-label="Carte du board ${i+1}">${cardOr(c,'')}</button>`).join('');
  /* 5 cartes « mémo » en bas à droite : pour se souvenir, ne comptent nulle part */
  const mm = (d.memo||[]).concat([null,null,null,null,null]).slice(0,5);
  const memo = (editable || mm.some(c=>c!=null))? `<div class="memo"><div class="lbl">Mémo<br>(pour ne pas oublier)</div><div class="cards-row">${mm.map((c,i)=> editable? `<button class="slot" onclick="editMemo(${i},${H})" aria-label="Carte mémo ${i+1}">${cardOr(c,'sm')}</button>` : cardOr(c,'sm')).join('')}</div></div>` : '';
  return `<div class="table ${editable?'edit':''}"><div class="felt"></div><div class="brandtxt">POKER WIN</div><div class="board">${board}</div>${potOf(d)>0? `<div class="pot" id="potLbl">Pot : ${chipAmt(potOf(d))}</div>`:''}${dealer}${seats}</div>${memo}`;
}
function handsHTML(){
  const tabs = [['add','Ajouter une main'],['saved','Mains enregistrées']];
  const head = `<div class="tabs">${tabs.map(t=>`<button class="${ui.handTab===t[0]?'on':''}" onclick="go('hands','${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  if(ui.handTab==='saved') return head + savedHandsHTML();
  if(!ui.draft) ui.draft = newDraft();
  const d = ui.draft;
  const opt = (arr,cur) => arr.map(a=>`<option ${cur===a?'selected':''}>${a}</option>`).join('');
  const editBar = d.editId? `<div class="box" style="display:flex;align-items:center;gap:10px;padding:12px 14px"><div style="flex:1">✎ <b>Tu modifies une main enregistrée.</b> <span class="dim">Touche un joueur pour mettre sa mise.</span></div></div>` : '';
  return head + editBar + tableHTML(d,false) + `<div class="box"><div class="stack">
    <div class="grid2"><div><label class="f">Type</label><select class="in" onchange="ui.draft.type=this.value">${opt(['cash','tournoi'].map(x=>x),d.type).replace('>cash<','>Cash game<').replace('>tournoi<','>Tournoi<')}</select></div>
    <div><label class="f">Nombre de joueurs</label><select class="in" onchange="changePlayers(this.value)">${[2,3,4,5,6,7,8,9].map(n=>`<option value="${n}" ${d.players===n?'selected':''}>${n} joueurs</option>`).join('')}</select></div></div>
    <div class="grid2"><div><label class="f">Jeu</label><select class="in" onchange="changeGame(this.value)">${opt(['Holdem','Omaha'],d.game)}</select></div>
    <div><label class="f">Limite</label><select class="in" onchange="ui.draft.limit=this.value">${opt(['No Limit','Pot Limit','Limit'],d.limit)}</select></div></div>
    <div class="grid2"><div><label class="f">Petite blind</label><input class="in" type="number" inputmode="decimal" value="${esc(d.sb)}" oninput="ui.draft.sb=this.value" onchange="render()"></div>
    <div><label class="f">Grosse blind</label><input class="in" type="number" inputmode="decimal" value="${esc(d.bb)}" oninput="ui.draft.bb=this.value" onchange="render()"></div></div>
    <div><label class="f">Commentaire</label><textarea class="in" oninput="ui.draft.comment=this.value" placeholder="Raconte la main : actions, mises, ce que tu hésitais à faire…">${esc(d.comment)}</textarea></div>
    <div class="box" style="margin:0;padding:14px" id="dAnaBox"><div id="dAnaOut" style="line-height:1.5">${d.analysis? mdLite(d.analysis) : '<span class="dim">Écris les actions dans le commentaire (qui mise combien), pose tes cartes et le board, puis demande à Claude.</span>'}</div><div id="dAnaErr" class="err"></div>
      <div class="row" style="margin-top:10px" id="dAnaRow"><button class="btn solid" onclick="analyzeDraft()">🧠 Quoi faire ?</button></div></div>
    <div class="row">${d.editId? `<button class="btn" onclick="inlineAsk(this,'Abandonner les changements ? La main enregistrée ne bouge pas.','Oui, abandonner',resetDraft)">Annuler</button>` : `<button class="btn" onclick="inlineAsk(this,'Effacer la main en cours ?','Oui, effacer',resetDraft)">Remettre à zéro</button>`}${d.editId? `<button class="btn solid" onclick="inlineAsk(this,'Enregistrer les changements de cette main ?','Oui, enregistrer',saveHand)">Enregistrer les changements</button>` : `<button class="btn solid" onclick="saveHand()">Enregistrer la main</button>`}</div>
    <div class="dim" style="text-align:center;font-size:.88rem">Touche un siège pour choisir ses cartes et sa pile, et touche le board pour poser les cartes communes.</div></div></div>`;
}
function changePlayers(n){ ui.draft.players = +n; render(); }
function changeGame(g){ ui.draft.game = g; Object.values(ui.draft.seats).forEach(s => { s.cards = s.cards.slice(0, needCards(g)); }); render(); }
/* main visée : la main en cours (hid null) ou une main enregistrée, modifiée sur place et sauvegardée tout de suite */
function handOf(hid){ return hid? S.hands.find(x=>x.id===hid) : ui.draft; }
function changeHand(hid, fn, redraw){
  if(!hid){ fn(ui.draft); if(redraw!==false) render(); return; }
  const h = JSON.parse(JSON.stringify(handOf(hid) || null)); if(!h) return;
  if(!h.seats) h.seats = {};
  fn(h); S.hands = S.hands.map(x => x.id===hid ? h : x); persist();
  if(redraw!==false) viewHand(hid, true);
}
function editBoard(i, hid){
  const d = handOf(hid); if(!d) return;
  pickCard(usedCardsHand(d), d.board[i], id => changeHand(hid, h => { h.board[i] = id; }));
}
function editMemo(i, hid){
  const d = handOf(hid); if(!d) return; const cur = (d.memo||[])[i];
  pickCard([], cur==null? null : cur, id => changeHand(hid, h => { h.memo = (h.memo||[]).concat([null,null,null,null,null]).slice(0,5); h.memo[i] = id; }));
}
function pickSeatCard(p, k, hid){
  const d = handOf(hid); if(!d) return; const cur = d.seats[p] ? d.seats[p].cards[k] : null;
  pickCard(usedCardsHand(d), cur==null? null : cur, id => changeHand(hid, h => { seatOf(h,p).cards[k] = id; }));
}
function editSeat(p){ ui.seatEdit = p; seatSheet(); }
function seatSheet(){
  const d = ui.draft, p = ui.seatEdit, s = seatOf(d,p), nc = needCards(d.game);
  const slots = Array.from({length:nc}, (_,k)=>`<button class="slot" onclick="seatCard(${k})" aria-label="Carte ${k+1}">${cardOr(s.cards[k]==null?null:s.cards[k],'lg')}</button>`).join('');
  openSheet(`<h2>Siège ${p}</h2><div class="stack">
    <div><label class="f">Mise totale de ce joueur dans la main (€)</label><input class="in" type="number" inputmode="decimal" value="${esc(s.bet==null?'':s.bet)}" placeholder="${p==='SB'&&d.sb? 'Vide = petite blind ('+esc(d.sb)+' €)' : p==='BB'&&d.bb? 'Vide = grosse blind ('+esc(d.bb)+' €)' : '0'}" oninput="seatOf(ui.draft,ui.seatEdit).bet=this.value"></div>
    <div class="row"><button class="btn ${s.option?'solid':''}" onclick="toggleOption()">${s.option?'✓ A pris l\'option':'A pris l\'option ?'}</button></div>
<div class="cards-row" style="gap:10px">${slots}</div>
    <div><label class="f">Pile (stack)</label><input class="in" type="number" inputmode="decimal" value="${esc(s.stack)}" oninput="seatOf(ui.draft,ui.seatEdit).stack=this.value"></div>
    <div class="row"><button class="btn ${s.hero?'solid':''}" onclick="toggleHero()">${s.hero?'✓ C\'est moi (Hero)':'C\'est moi (Hero)'}</button></div>
    <div class="row"><button class="btn" onclick="inlineAsk(this,'Vider ce siège ?','Oui, vider',seatSheetClear)">Vider le siège</button><button class="btn solid" onclick="closeSheet();render()">Terminer</button></div></div>`);
  ui.sheetRefresh = true;
}
function seatCard(k){
  const d = ui.draft, s = seatOf(d,ui.seatEdit);
  pickCard(usedCardsHand(d), s.cards[k], id => { s.cards[k] = id; seatSheet(); });
}
/* mise et option tapées directement au-dessus du joueur, sur la table */
function setBet(p, v, hid){
  changeHand(hid, h => { seatOf(h,p).bet = v; }, false);
  /* pas de rafraîchissement complet : on peut enchaîner les mises sans que le clavier se ferme */
  const d = handOf(hid), root = hid? $('#sheet') : $('#view');
  const inp = (root||document).querySelector(`.betin input[aria-label="Mise de ${p}"]`); if(inp) inp.classList.toggle('has', betOf(d,p)>0);
  const lbl = (root||document).querySelector('.pot'), pot = potOf(d);
  const s = d.seats[p] || {}, b = betOf(d,p), chipEl = (root||document).querySelector(`.bet[data-bet="${p}"]`);
  if(chipEl){ chipEl.innerHTML = '<i></i>'+feltTxt(b, !!s.option); chipEl.classList.toggle('off', !(b>0 || s.option)); }
  if(lbl && pot>0) lbl.textContent = 'Pot : '+chipAmt(pot); else if(hid) viewHand(hid, true); else render();
}
function feltTxt(b, opt){ return (opt?'OPT ':'') + (b>0? chipAmt(b) : ''); }
/* l'option (straddle) vaut 2 grosses blinds : posée toute seule si aucune mise n'est tapée */
function flipOption(h, p){ const s = seatOf(h,p), two = numOr0(h.bb)*2, empty = s.bet==null || s.bet==='';
  s.option = !s.option;
  if(s.option && empty && two>0) s.bet = String(two);
  else if(!s.option && two>0 && numOr0(s.bet)===two) s.bet = '';
}
/* tapis tapé directement sous le joueur, sans fenêtre */
function setStack(p, v, hid){
  changeHand(hid, h => { seatOf(h,p).stack = v; }, false);
  const root = hid? $('#sheet') : $('#view'), inp = root && root.querySelector(`.stkin input[aria-label="Tapis de ${p}"]`);
  if(inp) inp.classList.toggle('has', v!=='');
}
function toggleOptionAt(p, hid){ changeHand(hid, h => flipOption(h,p)); }
function toggleOption(){
  flipOption(ui.draft, ui.seatEdit); seatSheet();
}
function toggleHero(){
  const d = ui.draft, p = ui.seatEdit, was = seatOf(d,p).hero;
  Object.values(d.seats).forEach(s => s.hero = false);
  seatOf(d,p).hero = !was; seatSheet();
}
function seatSheetClear(){ delete ui.draft.seats[ui.seatEdit]; closeSheet(); render(); }
function saveHand(){
  const d = ui.draft;
  const any = d.board.some(c=>c!=null) || Object.values(d.seats).some(s=>s.cards.some(c=>c!=null)) || d.comment.trim();
  if(!any){ toast('Ajoute des cartes ou un commentaire'); return; }
  const copy = JSON.parse(JSON.stringify(d));
  if(d.editId && S.hands.some(h=>h.id===d.editId)){
    const id = d.editId; delete copy.editId;
    S.hands = S.hands.map(h => h.id===id ? Object.assign(copy, {id, ts:h.ts}) : h);
    ui.draft = newDraft(); persist(); go('hands','saved'); toast('Main modifiée'); return;
  }
  delete copy.editId;
  S.hands.unshift(Object.assign(copy, {id:uid(), ts:Date.now()}));
  ui.draft = newDraft(); persist(); go('hands','saved'); toast('Main enregistrée');
}
function heroOf(h){ const k = Object.keys(h.seats).find(p=>h.seats[p].hero); return k? h.seats[k] : null; }
function savedHandsHTML(){
  if(!S.hands.length) return `<div class="box empty"><b>Aucune main enregistrée</b>Dans l'onglet « Ajouter une main », pose tes cartes puis enregistre.</div>`;
  return S.hands.map(h => { const hero = heroOf(h);
    return `<button class="item" onclick="viewHand('${h.id}')"><div><div class="a">${h.game} ${h.limit}${h.bb? ' · '+esc(h.sb||'')+'/'+esc(h.bb):''}</div>
      <div class="b">${new Date(h.ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} · ${h.players} joueurs</div>
      <div class="b" style="margin-top:4px">${esc((h.comment||'').slice(0,70))}</div></div>
      <div class="cards-row" style="flex:none;flex-wrap:nowrap;gap:3px">${hero? hero.cards.map(c=>cardOr(c,'sm')).join('') : ''}</div></button>`; }).join('');
}
function viewHand(id, keep){
  const h = S.hands.find(x=>x.id===id); if(!h) return;
  const top = keep? $('#sheet').scrollTop : 0;
  openSheet(`<h2>${h.game} ${h.limit}${h.bb? ' · '+esc(h.sb||'')+'/'+esc(h.bb):''}</h2>${tableHTML(h,h.id)}
    <div class="dim" style="text-align:center;font-size:.85rem;margin:-6px 0 12px">Touche une carte pour la choisir, tape les mises au-dessus des joueurs. Appuie sur « Enregistrer la main » en bas quand tu as fini.</div>
    <button class="btn block" style="margin-bottom:14px" onclick="editSavedHand('${h.id}')">✎ Modifier cette main (mises, cartes, commentaire)</button>
    ${h.comment? `<div class="box" style="white-space:pre-wrap">${esc(h.comment)}</div>`:''}
    ${anaBoxHTML(h)}
    <div class="row" style="margin-bottom:10px"><button class="btn solid block" onclick="inlineAsk(this,'Enregistrer cette main ?','Oui, enregistrer',saveViewedHand)">💾 Enregistrer la main</button></div>
    <div class="row"><button class="btn danger" onclick="delHand('${h.id}')">Supprimer</button><button class="btn solid" onclick="closeSheet()">Fermer</button></div>`);
  if(keep) $('#sheet').scrollTop = top;
}

/* ---------- analyse de la main par Claude ---------- */
const SUITNAME = ['pique','cœur','carreau','trèfle'];
function cardTxt(id){ const r = RANKS[id>>2]; return (r==='T'?'10':r) + SUITS[id&3] + ' ('+SUITNAME[id&3]+')'; }
function handPrompt(h){
  const pos = POSLIST[h.players] || POSLIST[9];
  const heroPos = Object.keys(h.seats).find(p=>h.seats[p].hero);
  const known = pos.filter(p => h.seats[p] && h.seats[p].cards.some(c=>c!=null));
  const seats = pos.map(p => { const s = h.seats[p]; if(!s) return null;
    const cs = s.cards.filter(c=>c!=null).map(cardTxt).join(' ');
    const bits = [cs? 'cartes : '+cs : '', s.stack!==''&&s.stack!=null? 'tapis : '+s.stack+' €' : '', s.bet!==''&&s.bet!=null? 'a misé au total '+s.bet+' €' : '', s.option? 'a pris l\'option (straddle)' : ''].filter(Boolean);
    return bits.length? '- '+p+(p===heroPos?' (MOI, le joueur qui demande)':'')+' : '+bits.join(', ') : null; }).filter(Boolean);
  const board = h.board.filter(c=>c!=null).map(cardTxt);
  const street = board.length>=5? 'river' : board.length===4? 'turn' : board.length===3? 'flop' : 'préflop';
  return `Tu es un coach de poker expert (${h.game==='Omaha'?'Pot-Limit Omaha 4 cartes':'Texas Hold\'em'}). Un joueur amateur français te décrit une main de cash game et veut savoir quelle est l'action optimale.

Main :
- Jeu : ${h.game==='Omaha'?'Omaha (4 cartes privées)':'Hold\'em (2 cartes privées)'}, ${h.limit}
- Blinds : ${h.sb||'?'} / ${h.bb||'?'} €${potOf(h)>0? '\n- Pot calculé d\'après les mises saisies : '+potOf(h)+' €' : ''}
- ${h.players} joueurs à table. Positions dans l'ordre de parole préflop : ${pos.join(', ')}. BU = bouton (donneur).
${heroPos? '- Le joueur qui demande est en '+heroPos+'.' : known.length===1? '- Le joueur qui demande est probablement en '+known[0]+' (seul siège dont les cartes sont connues).' : '- Le joueur n\'a pas indiqué son siège : déduis-le du commentaire (« moi »).'}
Sièges renseignés :
${seats.join('\n') || '- aucun'}
- Board (${street}) : ${board.join(' ') || 'aucune carte'}${(h.memo||[]).some(c=>c!=null)? '\n- Cartes notées pour mémoire par le joueur (pas forcément sur le board) : '+h.memo.filter(c=>c!=null).map(cardTxt).join(' ') : ''}
- Commentaire du joueur (actions de la main, écrit vite sur téléphone, à interpréter) : « ${h.comment||'aucun'} »

Réponds en français simple, pour un débutant, en 200 mots maximum, avec exactement ces parties :
**Ce que j'ai compris** : 1 ou 2 phrases qui reformulent la situation (positions, pot, mise à payer). Si une info manque, dis quelle hypothèse tu fais.
**Ma main** : force de la main sur ce board, tirages, ce qui me bat.
**Action conseillée** : UNE action claire (se coucher, checker, payer, relancer à X €), en gras.
**Pourquoi** : 2 ou 3 raisons courtes (cotes du pot, équité approximative, position, adversaires).
**Plan pour la suite** : quoi faire sur les cartes suivantes ou en cas de relance.
Pas de tableau, pas de titre en #.`;
}
function mdLite(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[-•]\s+/gm,'• ').replace(/\n/g,'<br>'); }
function anaBoxHTML(h){
  const has = !!h.analysis;
  return `<div class="box" id="anaBox"><h3 style="margin-top:0">🧠 Conseil de Claude</h3>
    <div id="anaOut" style="line-height:1.5">${has? mdLite(h.analysis) : '<span class="dim">Claude lit le commentaire, les cartes et le board, puis te dit quelle action jouer et pourquoi. Écris bien les actions dans le commentaire (qui mise combien).</span>'}</div>
    <div id="anaErr" class="err"></div>
    <div class="row" style="margin-top:12px" id="anaRow">${has
      ? `<button class="btn" onclick="inlineAsk(this,'Refaire l’analyse ? L’ancienne sera remplacée.','Oui, refaire',()=>analyzeHand('${h.id}'))">↻ Refaire l'analyse</button>`
      : `<button class="btn solid" onclick="analyzeHand('${h.id}')">🧠 Quelle est la bonne action ?</button>`}</div></div>`;
}
let anaCtl = null;
/* dans l'appli du téléphone : la main est envoyée à Claude (appli Claude ou claude.ai), question déjà écrite */
function askClaudeApp(prompt){
  try{ navigator.clipboard && navigator.clipboard.writeText(prompt).catch(()=>{}); }catch(e){}
  toast('Ouverture de Claude…');
  setTimeout(()=>{ location.href = 'https://claude.ai/new?q=' + encodeURIComponent(prompt); }, 300);
}
async function analyzeHand(id){
  const h = S.hands.find(x=>x.id===id); if(!h) return;
  const out = $('#anaOut'), row = $('#anaRow'), err = $('#anaErr');
  err.textContent = '';
  let sample = null;
  try{ sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; }catch(e){}
  if(!sample){ askClaudeApp(handPrompt(h)); return; }
  anaCtl = new AbortController();
  out.innerHTML = '<span class="dim">Claude réfléchit… (de 10 secondes à 1 minute)</span>';
  row.innerHTML = `<button class="btn" onclick="anaCtl&&anaCtl.abort()">Arrêter</button>`;
  try{
