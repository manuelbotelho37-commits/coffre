/* ============================================================
   CALCULATEUR D'ÉQUITÉ (Monte-Carlo) — Hold'em et Omaha
   ============================================================ */
/*CALC_START*/
function combosOf(n,k){ const out=[]; (function rec(s,cur){ if(cur.length===k){ out.push(cur.slice()); return; } for(let i=s;i<n;i++){ cur.push(i); rec(i+1,cur); cur.pop(); } })(0,[]); return out; }
const C7_5 = combosOf(7,5), C4_2 = combosOf(4,2), C5_3 = combosOf(5,3);
const CNT = new Int8Array(13);
function pk(a){ let v=0; for(let i=0;i<5;i++) v = v*13 + (a[i]||0); return v; }
/* évaluation d'une main de 5 cartes, écrite sans tableaux temporaires pour aller vite */
function eval5(a,b,c,d,e){
  CNT[a>>2]++; CNT[b>>2]++; CNT[c>>2]++; CNT[d>>2]++; CNT[e>>2]++;
  const s = a&3, flush = (b&3)===s && (c&3)===s && (d&3)===s && (e&3)===s;
  let quad=-1, trip=-1, p1=-1, p2=-1, ns=0, s0=0, s1=0, s2=0, s3=0, s4=0;
  for(let r=12;r>=0;r--){ const n = CNT[r]; if(!n) continue; CNT[r]=0;
    if(n===1){ if(ns===0) s0=r; else if(ns===1) s1=r; else if(ns===2) s2=r; else if(ns===3) s3=r; else s4=r; ns++; }
    else if(n===2){ if(p1<0) p1=r; else p2=r; }
    else if(n===3) trip=r; else quad=r; }
  const B = 371293;
  if(ns===5){
    let st = -1; if(s0-s4===4) st = s0; else if(s0===12 && s1===3) st = 3;
    if(st>=0) return (flush? 8 : 4)*B + st*28561;
    if(flush) return 5*B + (((s0*13+s1)*13+s2)*13+s3)*13+s4;
    return (((s0*13+s1)*13+s2)*13+s3)*13+s4;
  }
  if(quad>=0) return 7*B + (quad*13+s0)*2197;
  if(trip>=0) return p1>=0 ? 6*B + (trip*13+p1)*2197 : 3*B + ((trip*13+s0)*13+s1)*169;
  if(p2>=0) return 2*B + ((p1*13+p2)*13+s0)*169;
  return 1*B + (((p1*13+s0)*13+s1)*13+s2)*13;
}
const C7F = [].concat(...C7_5), O2 = [].concat(...C4_2), O3 = [].concat(...C5_3);
function bestHold(h, board){
  const cs = [h[0],h[1],board[0],board[1],board[2],board[3],board[4]]; let best=-1;
  for(let i=0;i<105;i+=5){ const v = eval5(cs[C7F[i]],cs[C7F[i+1]],cs[C7F[i+2]],cs[C7F[i+3]],cs[C7F[i+4]]); if(v>best) best=v; }
  return best;
}
function bestOmaha(h, board){
  let best=-1;
  for(let i=0;i<12;i+=2){ const x = h[O2[i]], y = h[O2[i+1]];
    for(let j=0;j<30;j+=3){ const v = eval5(x, y, board[O3[j]], board[O3[j+1]], board[O3[j+2]]); if(v>best) best=v; } }
  return best;
}
/* code d'un « ouvrier » qui calcule une part des mains dans un autre cœur du processeur */
function workerSrc(){
  return [combosOf, eval5, bestHold, bestOmaha].map(f=>f.toString()).join('\n') + `
const C7_5 = combosOf(7,5), C4_2 = combosOf(4,2), C5_3 = combosOf(5,3), CNT = new Int8Array(13);
const C7F = [].concat(...C7_5), O2 = [].concat(...C4_2), O3 = [].concat(...C5_3);
onmessage = e => {
  const {players, boardKnown, deck, missBoard, missHole, game, sims} = e.data, np = players.length;
  const ev = game==='Omaha' ? bestOmaha : bestHold, draw = missBoard + missHole.reduce((a,b)=>a+b,0);
  const wins = new Array(np).fill(0), ties = new Array(np).fill(0), eq = new Array(np).fill(0), vals = new Array(np);
  const board = boardKnown.slice(), hands = players.map(p=>p.slice()); let done = 0;
  function step(){
    const t0 = Date.now();
    while(done<sims && Date.now()-t0 < 250){
      for(let i=0;i<draw;i++){ const j = i + Math.floor(Math.random()*(deck.length-i)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
      let k = 0; board.length = boardKnown.length; for(let i=0;i<missBoard;i++) board.push(deck[k++]);
      let bestV = -1, nb = 0;
      for(let p=0;p<np;p++){ const h = hands[p]; h.length = players[p].length; for(let i=0;i<missHole[p];i++) h.push(deck[k++]);
        const v = ev(h, board); vals[p] = v; if(v>bestV){ bestV=v; nb=1; } else if(v===bestV) nb++; }
      for(let p=0;p<np;p++) if(vals[p]===bestV){ if(nb===1){ wins[p]++; eq[p]+=1; } else { ties[p]++; eq[p]+=1/nb; } }
      done++;
    }
    postMessage({done, wins, ties, eq, end: done>=sims});
    if(done<sims) setTimeout(step, 0);
  }
  step();
};`;
}
function runParallel(players, boardKnown, deck, missBoard, missHole, game, sims, onProgress){
  let url, workers = [];
  try{
    const n = Math.max(2, Math.min(8, (navigator.hardwareConcurrency||4)));
    url = URL.createObjectURL(new Blob([workerSrc()], {type:'text/javascript'}));
    for(let i=0;i<n;i++) workers.push(new Worker(url));
  }catch(e){ workers.forEach(w=>w.terminate()); return null; }
  const np = players.length, n = workers.length, part = workers.map((_,i)=> Math.floor(sims/n) + (i < sims%n ? 1 : 0));
  const st = workers.map(()=>({done:0, wins:new Array(np).fill(0), ties:new Array(np).fill(0), eq:new Array(np).fill(0), end:false}));
  return new Promise((resolve, reject) => {
    let finished = false, gotAny = false;
    /* les ouvriers ne marchent pas ici : on refait le calcul normalement, sur un seul cœur */
    const fallback = () => { if(finished) return; finished = true; clearInterval(tick); clearTimeout(guard); workers.forEach(x=>x.terminate());
      runEquity.noWorkers = true; runEquity(players, boardKnown, [], game, sims, onProgress).then(resolve, reject); };
    const guard = setTimeout(() => { if(!gotAny) fallback(); }, 4000);
    const total = () => { const T = {done:0, wins:new Array(np).fill(0), ties:new Array(np).fill(0), eq:new Array(np).fill(0)};
      st.forEach(s => { T.done += s.done; for(let p=0;p<np;p++){ T.wins[p]+=s.wins[p]; T.ties[p]+=s.ties[p]; T.eq[p]+=s.eq[p]; } }); return T; };
    const finish = stopped => { if(finished) return; finished = true; clearInterval(tick); workers.forEach(w=>w.terminate()); URL.revokeObjectURL(url);
      const T = total(), d = Math.max(1, T.done);
      resolve({ sims:T.done, exact:false, stopped, workers:n, res: T.wins.map((w,i)=>({win:w/d, tie:T.ties[i]/d, eq:T.eq[i]/d})) }); };
    workers.forEach((w,i) => {
      w.onmessage = e => { gotAny = true; st[i] = e.data; if(st.every(s=>s.end)) finish(false); };
      w.onerror = fallback;
      w.postMessage({players, boardKnown, deck: deck.slice(), missBoard, missHole, game, sims: part[i]});
    });
    runEquity.stop = false;
    const tick = setInterval(() => {
      const T = total(); if(onProgress && T.done) onProgress(T.done/sims, T.eq.map(x=>x/T.done));
      if(runEquity.stop && T.done>0) finish(true);
    }, 300);
  });
}
/* players : tableau de tableaux de cartes connues (0..n cartes). Retourne une promesse {res:[{win,tie,eq}], sims} */
function runEquity(players, boardKnown, dead, game, sims, onProgress){
  return new Promise((resolve, reject) => {
    const need = game==='Omaha' ? 4 : 2, np = players.length;
    const known = new Set(); const all = [];
    players.forEach(p=>p.forEach(c=>all.push(c))); boardKnown.forEach(c=>all.push(c)); dead.forEach(c=>all.push(c));
    for(const c of all){ if(known.has(c)){ reject(new Error('Une carte est utilisée deux fois.')); return; } known.add(c); }
    if(![0,3,4,5].includes(boardKnown.length)){ reject(new Error('Le board doit avoir 0, 3, 4 ou 5 cartes.')); return; }
    const deck = []; for(let i=0;i<52;i++) if(!known.has(i)) deck.push(i);
    const missBoard = 5 - boardKnown.length;
    const missHole = players.map(p => need - p.length);
    const draw = missBoard + missHole.reduce((a,b)=>a+b,0);
    if(draw > deck.length){ reject(new Error('Pas assez de cartes dans le paquet.')); return; }
    if(draw===0) sims = 1;
    const wins = new Array(np).fill(0), ties = new Array(np).fill(0), eq = new Array(np).fill(0);
    let done = 0; const CH = game==='Omaha' ? 600 : 2500;
    const ev = game==='Omaha' ? bestOmaha : bestHold;
    /* toutes les mains connues et peu de suites possibles : on les passe TOUTES en revue (calcul exact, mieux que des millions de tirages au hasard) */
    const combN = (n,k) => { let r = 1; for(let i=0;i<k;i++) r = r*(n-i)/(i+1); return Math.round(r); };
    const exact = draw>0 && missHole.every(x=>x===0) && combN(deck.length, missBoard) <= Math.max(sims, 2000000);
    if(exact) sims = combN(deck.length, missBoard);
    /* gros calcul au hasard : on le partage entre tous les cœurs du téléphone (si le navigateur le permet) */
    if(!exact && sims>=100000 && !runEquity.noWorkers){ const par = runParallel(players, boardKnown, deck, missBoard, missHole, game, sims, onProgress); if(par){ par.then(resolve, reject); return; } }
    const idx = Array.from({length:missBoard}, (_,i)=>i);
    runEquity.stop = false;
    const board = boardKnown.slice(), hands = players.map(p => p.slice()), vals = new Array(np);
    function step(){
      /* on calcule par tranches d'environ 60 ms : l'écran reste fluide sans perdre de temps entre deux tranches */
      const t0 = performance.now();
      while(done<sims && performance.now()-t0 < 60){
      const lim = Math.min(sims, done+CH);
      for(; done<lim; done++){
        let k = 0; board.length = boardKnown.length;
        if(exact){
          for(let i=0;i<missBoard;i++) board.push(deck[idx[i]]);
          let i = missBoard-1; while(i>=0 && idx[i]===deck.length-missBoard+i) i--;
          if(i>=0){ idx[i]++; for(let j=i+1;j<missBoard;j++) idx[j] = idx[j-1]+1; }
        } else {
          for(let i=0;i<draw;i++){ const j = i + Math.floor(Math.random()*(deck.length-i)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
          for(let i=0;i<missBoard;i++) board.push(deck[k++]);
        }
        let bestV = -1, nb = 0;
        for(let p=0;p<np;p++){
          const h = hands[p]; h.length = players[p].length; for(let i=0;i<missHole[p];i++) h.push(deck[k++]);
          const v = ev(h, board); vals[p] = v;
          if(v>bestV){ bestV=v; nb=1; } else if(v===bestV) nb++;
        }
        for(let p=0;p<np;p++) if(vals[p]===bestV){ if(nb===1){ wins[p]++; eq[p]+=1; } else { ties[p]++; eq[p]+=1/nb; } }
      }
      }
      if(onProgress) onProgress(done/sims, done? eq.map(x=>x/done) : null);
      const stopped = runEquity.stop && done<sims && done>0;
      if(done<sims && !stopped) setTimeout(step, 0);
      else resolve({ sims:done, exact: exact && !stopped, stopped, res: wins.map((w,i)=>({win:w/done, tie:ties[i]/done, eq:eq[i]/done})) });
    }
    step();
  });
}
/*CALC_END*/

    <div id="calcErr" class="err">${esc(c.err)}</div>
    <button class="btn solid block" id="calcBtn" onclick="runCalc()">${c.running?'Calcul en cours…':'Calculer'}</button>
    ${c.running? '<div class="box" id="calcLive" style="margin:0;padding:12px 14px"><div class="dim">Calcul en cours…</div></div><button class="btn block" onclick="runEquity.stop=true">■ Arrêter (garde le résultat déjà calculé)</button>' : ''}
    <div class="row"><button class="btn block" onclick="inlineAsk(this,'Enregistrer cette main dans Mains enregistrées ?','Oui, enregistrer',saveCalcHand)">💾 Enregistrer la main</button></div></div></div>${resHTML}`;
}
/* enregistre la main du calculateur dans « Mains enregistrées » : Hero au bouton, les autres joueurs à BB, SB, CO, HJ, MP */
function saveCalcHand(){
  const c = ui.calc; if(!c) return;
  const any = c.board.some(x=>x!=null) || c.players.some(p=>p.some(x=>x!=null));
  if(!any){ c.err = 'Pose au moins une carte avant d\'enregistrer.'; render(); return; }
  const h = newDraft(); h.game = c.game; h.players = 8; h.limit = c.game==='Omaha'? 'Pot Limit' : 'No Limit';
  h.board = c.board.slice(0,5).map(x => x==null? null : x);
  const seatsFor = ['BU','BB','SB','CO','HJ','MP'];
  c.players.forEach((p,i) => { const s = seatOf(h, seatsFor[i]); s.cards = p.map(x => x==null? null : x); if(i===0) s.hero = true; });
  if(c.pot!=='' && c.pot!=null) h.pot = c.pot;
  const pct = x => (x*100).toFixed(1).replace('.',',')+' %';
  const lines = ['Depuis le calculateur.'];
  if(c.pot!=='' && c.pot!=null) lines.push('Pot avant mon call : '+c.pot+' €'+(c.call? ' · à payer : '+c.call+' €' : ''));
  if(c.result) lines.push('Équité : '+c.result.res.map((x,i)=>(i===0?'Moi (BU)':seatsFor[i])+' '+pct(x.eq)).join(', '));
  const noted = (c.notes||[]).filter(x=>x!=null);
  if(noted.length) lines.push('Cartes notées : '+noted.map(id => { const r = RANKS[id>>2]; return (r==='T'?'10':r)+SUITS[id&3]; }).join(' '));
  h.comment = lines.join('\n');
  S.hands.unshift(Object.assign(h, {id:uid(), ts:Date.now()}));
  persist(); go('hands','saved'); toast('Main enregistrée');
}
function potVerdict(c, r){
  const pot = parseFloat(c.pot), call = parseFloat(c.call);
  if(isNaN(pot) || isNaN(call) || call<=0) return '';
  const need = call/(pot+call), eq = r.res[0].eq, ev = eq*pot - (1-eq)*call;
  const ok = eq >= need;
  return `<div class="verdict ${ok?'ok':'ko'}">${ok? 'Le call est rentable' : 'Le call n\'est pas rentable'} : ton équité est de ${(eq*100).toFixed(1).replace('.',',')} % pour ${(need*100).toFixed(1).replace('.',',')} % nécessaires.<div class="dim" style="font-weight:500;margin-top:4px">Gain moyen du call : <span class="${cls(ev)}">${eur(ev,true)}</span></div></div>`;
}
function calcGame(g){ const c = ui.calc; c.game = g; const n = needCards(g); c.players = c.players.map(p => p.slice(0,n)); c.result = null; render(); }
function calcPlayers(d){ const c = ui.calc; if(d>0 && c.players.length<6) c.players.push([]); if(d<0 && c.players.length>2) c.players.pop(); c.result=null; render(); }
function calcBoard(i){ const c = ui.calc; pickCard(calcUsed(c), c.board[i], id => { c.board[i] = id; c.result=null; render(); }); }
function calcHole(i,k){ const c = ui.calc; pickCard(calcUsed(c), c.players[i][k], id => { c.players[i][k] = id; c.result=null; render(); }); }
/* carte notée : pour mémoire seulement, ni retirée du paquet ni comptée dans le calcul */
function calcNote(i){ const c = ui.calc; c.notes = c.notes || [null]; pickCard([], c.notes[i], id => { c.notes[i] = id; render(); }); }
function calcDead(i){ const c = ui.calc; pickCard(calcUsed(c), c.dead[i], id => { c.dead[i] = id; c.result=null; render(); }); }
async function runCalc(){
  const c = ui.calc; if(c.running) return;
  const clean = a => a.filter(x=>x!=null);
  c.err = ''; c.running = true; c.result = null; render();
  try{
    const res = await runEquity(c.players.map(clean), clean(c.board), clean(c.dead), c.game, c.sims, (p, live) => { const b=$('#calcBtn'); if(b) b.textContent = 'Calcul en cours… '+(p*100).toFixed(p<0.1?1:0).replace('.',',')+' %';
      const l = $('#calcLive'); if(l && live) l.innerHTML = '<div class="dim" style="font-size:.82rem;margin-bottom:4px">Résultat en direct (il se précise au fil du calcul)</div>' + live.map((x,i)=>`<div class="row" style="justify-content:space-between"><b>${i===0?'Mes cartes':'Joueur '+(i+1)}</b><span style="font-family:var(--display);font-weight:600">${(x*100).toFixed(1).replace('.',',')} %</span></div>`).join(''); });
    c.result = res;
  }catch(e){ c.err = e.message || 'Calcul impossible.'; }
  c.running = false; render();
  const first = $('.verdict') || $('.eqbar'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- démarrage ---------- */
/* ---------- Sauvegarde automatique Google Drive (même script Google que Coffre et Dépenses) ---------- */
const DRV_URL='poker_drive_url', DRV_LAST='poker_drive_last', DRV_PENDING='poker_drive_pending', DRV_FOLDER='Poker - Sauvegardes';
let drvTimer=null, drvBusy=false;
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function drvUrl(){ return (lsGet(DRV_URL)||S.drv||'').trim(); }
function drvLast(){ return parseInt(lsGet(DRV_LAST)||'0',10)||0; }
function drvInfoTxt(){
  if(!drvUrl()) return 'Pas encore activée : colle le même lien que dans Coffre ou Dépenses.';
  const t=drvLast(); return t?'✓ Activée. Dernier envoi : '+new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'Activée, premier envoi dans quelques secondes.'; }
function drvShow(msg,ok){ const el=document.getElementById('drvInfo'); if(!el) return; el.textContent=msg||drvInfoTxt(); el.style.color=msg?(ok?'var(--gain)':'var(--loss)'):''; }
function drvSaveUrl(){ const e=document.getElementById('drvUrl'); if(!e) return; const v=e.value.trim(); lsSet(DRV_URL, v||null); if(v && S.drv!==v){ S.drv=v; persist(); } drvShow(); }
function hasData(){ return (S.sessions||[]).length || (S.hands||[]).length || (S.notes||[]).length || (S.tournois||[]).length; }
async function drvUpload(manual){
  const url=drvUrl();
  if(!url){ if(manual) drvShow('Colle d\'abord le lien du script Google.',false); return; }
  if(!manual && !hasData()) return; // jamais de copie vide
  if(drvBusy) return; drvBusy=true; clearTimeout(drvTimer);
  if(manual) drvShow('Envoi en cours…',true);
  try{
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const nom='poker-sauvegarde-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+'h'+p(d.getMinutes())+'.json';
    const body=JSON.stringify({nom, contenu:JSON.stringify(S), dossier:DRV_FOLDER, garder:200});
    if(!manual && body.length<60000){
      lsSet(DRV_LAST,String(Date.now())); lsSet(DRV_PENDING,null);
      await fetch(url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, keepalive:true, mode:'no-cors'});
      drvShow(); return;
    }
    const res=await fetch(url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body}); const txt=(await res.text()).trim();
    if(txt!=='ok') throw new Error(txt.slice(0,60));
    lsSet(DRV_LAST,String(Date.now())); lsSet(DRV_PENDING,null);
    drvShow(manual?'✓ Sauvegarde envoyée sur ton Google Drive':'',true);
  }catch(e){ if(manual) drvShow(navigator.onLine?'Échec de l\'envoi : vérifie le lien du script.':'Pas de connexion : l\'envoi se fera dès que tu auras internet.',false); }
  finally{ drvBusy=false; }
}
function drvSchedule(){ if(!drvUrl()) return; lsSet(DRV_PENDING,'1'); clearTimeout(drvTimer); drvTimer=setTimeout(()=>drvUpload(false),1500); }
function drvCheck(){ if(!drvUrl()||!navigator.onLine) return; if(lsGet(DRV_PENDING) || Date.now()-drvLast()>24*3600000) drvUpload(false); }
window.addEventListener('online', drvCheck);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(lsGet(DRV_PENDING)){ clearTimeout(drvTimer); drvUpload(false); } } else drvCheck(); });
setTimeout(drvCheck, 5000); setInterval(drvCheck, 3600000);
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
initStorage();
</script>
